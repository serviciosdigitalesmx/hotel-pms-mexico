spring:
  application:
    name: frontdesk-service
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      username: ${CONFIG_SERVER_USERNAME:configuser}
      password: ${CONFIG_SERVER_PASSWORD}

eureka:
  client:
    enabled: false

# México runtime default: Alloggiati remains disabled. This kills the startup
# catalog downloader and the automatic PII sender regardless of any
# hotel-level alloggiatiAutoSend flag left over from the Italian data model.
hotel-pms:
  alloggiati:
    enabled: false


# Internal HMAC security - injected by setup-hmac-secret script
internal:
  hmac:
    secret: ${INTERNAL_HMAC_SECRET}
