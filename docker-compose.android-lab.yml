# GitHub-hosted Android lab override. Uses the published Native images directly.
x-native-env: &native-env
  INTERNAL_REDIS_HOST: redis
  INTERNAL_REDIS_PASSWORD: ${REDIS_PASSWORD}
  SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
  CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD}
  INTERNAL_HMAC_SECRET: ${INTERNAL_HMAC_SECRET}
  JWT_SECRET: ${JWT_SECRET}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
  JAVA_TOOL_OPTIONS: "-Xmx512m -XX:MaxMetaspaceSize=256m -XX:+ExitOnOutOfMemoryError"

services:
  postgres:
    build: !reset null
    image: postgres:15-alpine
  redis:
    build: !reset null
    image: redis:7-alpine
  config-server:
    image: ghcr.io/${GHCR_OWNER:-serviciosdigitalesmx}/fixi-config-server:${FIXI_NATIVE_TAG:-native-latest}
    ports: ["127.0.0.1:18888:8888", "127.0.0.1:18100:8090"]
    environment:
      <<: *native-env
      SPRING_PROFILES_ACTIVE: native
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD}
  api-gateway:
    image: ghcr.io/${GHCR_OWNER:-serviciosdigitalesmx}/fixi-api-gateway:${FIXI_NATIVE_TAG:-native-latest}
    ports: ["127.0.0.1:18000:8080", "127.0.0.1:18101:8090"]
    environment:
      <<: *native-env
      CONFIG_SERVER_URL: http://config-server:8888
      GW_AUTH_SERVICE_URI: http://auth-service:8087
      GW_GUEST_SERVICE_URI: http://guest-service:8083
      GW_FRONTDESK_SERVICE_URI: http://frontdesk-service:8081
      GW_BILLING_SERVICE_URI: http://billing-service:8085
      GW_FB_SERVICE_URI: http://fb-service:8086
  auth-service:
    image: ghcr.io/${GHCR_OWNER:-serviciosdigitalesmx}/fixi-auth-service:${FIXI_NATIVE_TAG:-native-latest}
    ports: ["127.0.0.1:18087:8087", "127.0.0.1:18102:8090"]
    environment:
      <<: *native-env
      SPRING_PROFILES_ACTIVE: auth-service
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hotel_auth
      SPRING_DATASOURCE_USERNAME: postgres
  guest-service:
    image: ghcr.io/${GHCR_OWNER:-serviciosdigitalesmx}/fixi-guest-service:${FIXI_NATIVE_TAG:-native-latest}
    ports: ["127.0.0.1:18083:8083", "127.0.0.1:18103:8090"]
    environment:
      <<: *native-env
      SPRING_PROFILES_ACTIVE: guest-service
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hotel_guest
      SPRING_DATASOURCE_USERNAME: postgres
  frontdesk-service:
    image: ghcr.io/${GHCR_OWNER:-serviciosdigitalesmx}/fixi-frontdesk-service:${FIXI_NATIVE_TAG:-native-latest}
    ports: ["127.0.0.1:18081:8081", "127.0.0.1:18104:8090"]
    environment:
      <<: *native-env
      SPRING_PROFILES_ACTIVE: frontdesk-service
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hotel_frontdesk
      SPRING_DATASOURCE_USERNAME: postgres
  billing-service:
    image: ghcr.io/${GHCR_OWNER:-serviciosdigitalesmx}/fixi-billing-service:${FIXI_NATIVE_TAG:-native-latest}
    ports: ["127.0.0.1:18085:8085", "127.0.0.1:18105:8090"]
    environment:
      <<: *native-env
      SPRING_PROFILES_ACTIVE: billing-service
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hotel_billing
      SPRING_DATASOURCE_USERNAME: postgres
  fb-service:
    image: ghcr.io/${GHCR_OWNER:-serviciosdigitalesmx}/fixi-fb-service:${FIXI_NATIVE_TAG:-native-latest}
    ports: ["127.0.0.1:18086:8086", "127.0.0.1:18106:8090"]
    environment:
      <<: *native-env
      SPRING_PROFILES_ACTIVE: fb-service
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hotel_fb
      SPRING_DATASOURCE_USERNAME: postgres
  notification-service:
    image: ghcr.io/${GHCR_OWNER:-serviciosdigitalesmx}/fixi-notification-service:${FIXI_NATIVE_TAG:-native-latest}
    ports: ["127.0.0.1:18088:8088", "127.0.0.1:18107:8090"]
    environment:
      <<: *native-env
      SPRING_PROFILES_ACTIVE: notification-service
      CONFIG_SERVER_URL: http://config-server:8888
