# Include alongside docker-compose.yml on the PMS host.
services:
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SERVER_URL: http://evolution:8080
      # Local-development fallback only. Production must provide a unique secret.
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-local-evolution-development-key}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: 'false'
      TELEMETRY_ENABLED: 'false'
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD:-local-evolution-development-db}@evolution-postgres:5432/evolution?schema=public
      DATABASE_SAVE_DATA_INSTANCE: 'true'
      DATABASE_SAVE_DATA_NEW_MESSAGE: 'false'
      DATABASE_SAVE_DATA_CONTACTS: 'false'
      DATABASE_SAVE_DATA_CHATS: 'false'
      DATABASE_SAVE_DATA_HISTORIC: 'false'
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://evolution-redis:6379/0
      CACHE_REDIS_PREFIX_KEY: pms-evolution
      CACHE_REDIS_SAVE_INSTANCES: 'false'
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - evolution-network
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
  evolution-postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_DB: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:-local-evolution-development-db}
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
    networks:
      - evolution-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U evolution -d evolution']
      interval: 10s
      timeout: 5s
      retries: 10
  evolution-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - evolution_redis:/data
    networks:
      - evolution-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
  frontdesk-service:
    environment:
      EVOLUTION_BASE_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-local-evolution-development-key}
    networks:
      - evolution-network
volumes:
  evolution_instances:
  evolution_postgres:
  evolution_redis:
networks:
  evolution-network:
    driver: bridge
