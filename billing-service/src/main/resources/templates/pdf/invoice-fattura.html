<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es-MX">
<head>
    <meta charset="UTF-8"/>
    <title th:text="'Factura ' + ${invoiceNumber} + ' — ' + ${hotelName}">Factura</title>
    <meta name="description" th:content="'Factura ' + ${invoiceNumber} + ' emitida por ' + ${hotelName}"/>
    <meta name="subject" content="Factura"/>
    <th:block th:replace="~{invoice-fragments :: styles}"></th:block>
</head>
<body>

<div th:replace="~{invoice-fragments :: header}"></div>
<div th:replace="~{invoice-fragments :: meta}"></div>
<th:block th:replace="~{invoice-fragments :: chargesTable}"></th:block>
<th:block th:replace="~{invoice-fragments :: paymentsTable}"></th:block>

<div class="totals">
    <th:block th:each="vat : ${vatBreakdown}">
        <div class="row">
            <div class="label" th:text="'Base gravable ' + ${vat.rateLabel} + ':'">Base gravable 16%:</div>
            <div class="value" th:text="${vat.taxableFormatted}">MXN 0.00</div>
        </div>
        <div class="row">
            <div class="label" th:text="'IVA ' + ${vat.rateLabel} + ':'">IVA 10%:</div>
            <div class="value" th:text="${vat.vatFormatted}">MXN 0.00</div>
        </div>
    </th:block>
    <div class="row grand-total">
        <div class="label">TOTAL:</div>
        <div class="value" th:text="${totalFormatted}">MXN 0.00</div>
    </div>
    <div class="row">
        <div class="label">Saldo pendiente:</div>
        <div class="value" th:text="${dueFormatted}">MXN 0.00</div>
    </div>
</div>

</body>
</html>
