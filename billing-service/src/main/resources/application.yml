spring:
  application:
    name: billing-service
  config:
    # Runtime keeps Config Server mandatory. AOT/processAot may opt into the
    # optional import through SPRING_CONFIG_IMPORT without changing deployment.
    import: "${SPRING_CONFIG_IMPORT:configserver:${CONFIG_SERVER_URL:http://localhost:8888}}"
  cloud:
    config:
      username: ${CONFIG_SERVER_USERNAME:configuser}
      password: ${CONFIG_SERVER_PASSWORD}

eureka:
  client:
    enabled: false



# Internal HMAC security - injected by setup-hmac-secret script
internal:
  hmac:
    secret: ${INTERNAL_HMAC_SECRET}
