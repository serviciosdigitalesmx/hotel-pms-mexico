services:
  postgres:
    build: !reset null
    image: postgres:15-alpine
  auth-service:
    environment:
      FIXI_PLATFORM_BOOTSTRAP_ENABLED: "true"
      FIXI_PLATFORM_BOOTSTRAP_USERNAME: ${NATIVE_OTHER_USERNAME:-admin}
  frontend:
    build: !reset null
    image: hotel-pms/frontend:business-ci
    ports:
      - "127.0.0.1:18080:8080"
