# Production overrides for api-gateway
# Swagger/OpenAPI is disabled in production to prevent exposing
# the full API surface to unauthenticated users.
# Activate with: SPRING_PROFILES_ACTIVE=prod

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# In production, the gateway is reachable only through the private Docker
# network behind the frontend reverse proxy. The proxy overwrites X-Real-IP.
gateway:
  security:
    trust-forwarded-header: true
