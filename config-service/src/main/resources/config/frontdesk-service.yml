server:
  port: 8081

internal:
  hmac:
    secret: ${INTERNAL_HMAC_SECRET}

spring:
  data:
    redis:
      # Nonce store for internal HMAC anti-replay (T-GW-08). Same Redis
      # instance used by api-gateway for rate limiting, on a separate
      # key namespace (internal-auth:nonce:*).
      host: ${INTERNAL_REDIS_HOST:redis}
      port: ${INTERNAL_REDIS_PORT:6379}
      password: ${INTERNAL_REDIS_PASSWORD}
  cloud:
    discovery:
      client:
        simple:
          instances:
            # Only guest-service and billing-service remain external Feign
            # dependencies after the inventory/reservation/stay consolidation
            # into frontdesk-service (ADR-001, backup/DECISIONS.md). The
            # feign-hc5 PATCH-capable client is no longer needed either — the
            # only PATCH calls were to the now-internal room/reservation APIs.
            guest-service:
              - serviceId: guest-service
                host: guest-service
                port: 8083
                secure: false
            billing-service:
              - serviceId: billing-service
                host: billing-service
                port: 8085
                secure: false
            notification-service:
              - serviceId: notification-service
                host: notification-service
                port: 8088
                secure: false

management:
  server:
    port: 8090
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info"
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans

resilience4j:
  circuitbreaker:
    instances:
      notificationService:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
      billingService:
        # A legitimate 4xx rejection from billing-service (e.g. 409
        # INVOICE_LOCKED_AFTER_EXPORT) is a real business conflict, not
        # downstream unavailability — it must never be recorded as a circuit-
        # breaker failure nor trigger the addCharge/createInvoiceForStay
        # fallbacks, or the caller can never distinguish "billing-service is
        # down" from "billing-service said no" (round 1 bug #1).
        # FeignClientException groups every 4xx Feign exception; ignoring it
        # here means those propagate as real exceptions instead, while
        # genuine outages (5xx/timeout, in FeignServerException/
        # RetryableException) still hit the fallback.
        ignoreExceptions:
          - feign.FeignException$FeignClientException
      aiProvider:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 1
        ignoreExceptions:
          - com.hotelpms.frontdesk.assistant.PermanentAiProviderException
  retry:
    instances:
      aiProvider:
        maxAttempts: 3
        waitDuration: 250ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - com.hotelpms.frontdesk.assistant.RetryableAiProviderException
  ratelimiter:
    instances:
      aiProvider:
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 0

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
