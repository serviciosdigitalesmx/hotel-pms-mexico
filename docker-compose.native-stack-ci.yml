    environment:
      INTERNAL_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      JAVA_TOOL_OPTIONS: "-Xmx512m -XX:MaxMetaspaceSize=256m -XX:+ExitOnOutOfMemoryError"
  billing-service:
    build: !reset null
    container_name: !reset null
    image: hotel-pms/billing-service-${NATIVE_STACK_MODE:?Select native or jvm}:validated
    ports: !override
