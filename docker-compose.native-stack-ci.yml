      JAVA_TOOL_OPTIONS: "-Xmx512m -XX:MaxMetaspaceSize=256m -XX:+ExitOnOutOfMemoryError"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
  frontend:
    build: !reset null
    container_name: !reset null
    image: hotel-pms/frontend:stack-ci
    ports: !override
      - "127.0.0.1:18080:8080"
  zipkin:
    container_name: !reset null
    ports: !override
      - "127.0.0.1:19411:9411"
  loki:
    container_name: !reset null
    ports: !override
      - "127.0.0.1:13100:3100"
  mailpit:
    image: axllent/mailpit:v1.31.0
    ports:
      - "127.0.0.1:18025:8025"
    networks:
      - backend-network
