name: Fixi Monolith Platform Browser E2E

on:
  push:
    branches:
      - codex/fixi-monolith
    paths:
      - '.github/workflows/fixi-monolith-platform-e2e.yml'
      - 'fixi-monolith/**'
      - 'auth-service/**'
      - 'frontdesk-service/**'
      - 'guest-service/**'
      - 'billing-service/**'
      - 'fb-service/**'
      - 'notification-service/**'
      - 'internal-auth-lib/**'
      - 'common-web-lib/**'
      - 'pdf-template-engine/**'
      - 'frontend/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fixi-monolith-platform-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  platform-browser-e2e:
    name: Browser E2E against the real monolith
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fixi
          POSTGRES_USER: fixi
          POSTGRES_PASSWORD: fixi-monolith-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixi -d fixi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: fixi-platform-e2e-gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: fixi-platform-e2e-gradle-${{ runner.os }}-

      - name: Set up Node and pnpm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Build monolith JAR on GitHub Actions
        run: ./gradlew --no-daemon -x processAot -x processAotTest :fixi-monolith:bootJar

      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm run build

      - name: Start real monolith and frontend; run platform browser E2E
        env:
          DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/fixi
          DATABASE_USERNAME: fixi
          DATABASE_PASSWORD: fixi-monolith-ci
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: '1025'
          SMTP_AUTH: 'false'
          SMTP_STARTTLS: 'false'
          PORT: '8080'
          MANAGEMENT_PORT: '8090'
          ADMIN_USERNAME: e2e-live-other-hotel-admin
          ADMIN_PASSWORD: password
          TENANT_USERNAME: admin
          TENANT_PASSWORD: password
          TENANT_NEW_PASSWORD: FixiTenant123
          GW_CORS_ALLOWED_ORIGINS: http://localhost:5173
          FIXI_PLATFORM_BOOTSTRAP_ENABLED: 'true'
          FIXI_PLATFORM_BOOTSTRAP_USERNAME: e2e-live-other-hotel-admin
          FIXI_BOOTSTRAP_REMOVE_TEST_USERS_ON_STARTUP: 'false'
          PLAYWRIGHT_PLATFORM_BASE_URL: http://localhost:5173
        shell: bash
        run: |
          set -euo pipefail
          export JWT_SECRET="$(openssl rand -base64 48 | tr -d '\n')"
          jar="$(find fixi-monolith/build/libs -maxdepth 1 -name 'fixi-monolith-*.jar' ! -name '*-plain.jar' -print -quit)"
          test -n "$jar"
          LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY=DEBUG \
          LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB_SERVLET=DEBUG \
          LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB_SERVLET_MVC_METHOD_ANNOTATION=TRACE \
            java -jar "$jar" > /tmp/fixi-monolith-platform-e2e.log 2>&1 &
          app_pid=$!
          frontend_pid=''
          cleanup() {
            if [[ -n "$frontend_pid" ]]; then kill "$frontend_pid" 2>/dev/null || true; fi
            kill "$app_pid" 2>/dev/null || true
            wait "$frontend_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 120); do
            if curl --silent --show-error --fail http://localhost:8090/actuator/health/readiness >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo 'Monolith exited before readiness.'
              cat /tmp/fixi-monolith-platform-e2e.log
              exit 1
            fi
            sleep 5
          done
          if [[ "$ready" != 1 ]]; then
            echo 'Monolith did not become ready.'
            cat /tmp/fixi-monolith-platform-e2e.log
            exit 1
          fi

          pnpm --dir frontend exec vite preview --host 0.0.0.0 --port 5173 --strictPort \
            > /tmp/fixi-monolith-platform-vite.log 2>&1 &
          frontend_pid=$!
          frontend_ready=0
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail http://localhost:5173/login >/dev/null; then
              frontend_ready=1
              break
            fi
            if ! kill -0 "$frontend_pid" 2>/dev/null; then
              echo 'Vite exited before becoming ready.'
              cat /tmp/fixi-monolith-platform-vite.log
              exit 1
            fi
            sleep 2
          done
          [[ "$frontend_ready" == 1 ]]

          cd frontend
          PLATFORM_E2E_ADMIN_USERNAME="$ADMIN_USERNAME" \
          PLATFORM_E2E_ADMIN_PASSWORD="$ADMIN_PASSWORD" \
          PLATFORM_E2E_TENANT_USERNAME="$TENANT_USERNAME" \
          PLATFORM_E2E_TENANT_PASSWORD="$TENANT_PASSWORD" \
          PLATFORM_E2E_TENANT_NEW_PASSWORD="$TENANT_NEW_PASSWORD" \
            pnpm exec playwright test --config=playwright-platform-monolith.config.ts

          ! grep -Eqi 'Using generated security password' /tmp/fixi-monolith-platform-e2e.log

      - name: Upload browser artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fixi-platform-browser-e2e-${{ github.sha }}
          path: |
            frontend/test-results/platform-monolith-junit.xml
            frontend/test-results
            /tmp/fixi-monolith-platform-e2e.log
            /tmp/fixi-monolith-platform-vite.log
          if-no-files-found: ignore
