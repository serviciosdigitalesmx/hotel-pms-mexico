name: Fixi Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['fixi-android/**', '.github/workflows/android.yml']
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: fixi-android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"
          echo "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          sdkmanager --licenses < /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build debug APK
        run: ./gradlew assembleLocalDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: fixi-debug-apk
          path: fixi-android/app/build/outputs/apk/local/debug/*.apk
