name: Fixi Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['fixi-android/**', '.github/workflows/android.yml']
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: fixi-android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - uses: android-actions/setup-android@v3
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1
      - name: Build debug APK
        run: ./gradlew assembleLocalDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: fixi-debug-apk
          path: fixi-android/app/build/outputs/apk/debug/*.apk
