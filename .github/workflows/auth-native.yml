name: Auth Service Native Image

on:
  workflow_dispatch:
    inputs:
      native_quick_build:
        description: "Use GraalVM quick build (-Ob); disable for the final -O2 gate"
        required: false
        default: true
        type: boolean
  pull_request:
    branches:
      - main
    paths:
      - "auth-service/**"
      - "internal-auth-lib/**"
      - "common-web-lib/**"
      - "config-service/**"
      - "scripts/ci/verify-auth-native-runtime.sh"
      - "scripts/ci/measure-auth-native-runtime.py"
      - ".dockerignore"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/auth-native.yml"

jobs:
  native-build-and-runtime:
    name: Build and validate auth-service Native Image
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write
    env:
      CI_POSTGRES_PASSWORD: native-ci-postgres-password
      CI_REDIS_PASSWORD: native-ci-redis-password
      CI_CONFIG_PASSWORD: native-ci-config-password
      CI_HMAC_SECRET: native-ci-hmac-secret-with-sufficient-length
      CI_JWT_SECRET: TmF0aXZlQXV0aC1jaS1qd3Qtc2VjcmV0LXdpdGgtc3VmZmljaWVudC1sZW5ndGg=

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Maven and Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: ${{ runner.os }}-auth-native-jvm21-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-auth-native-jvm21-

      - name: Run cheap AOT and JVM regression gates
        env:
          SPRING_PROFILES_ACTIVE: auth-service
          CONFIG_SERVER_URL: http://127.0.0.1:8888
          CONFIG_SERVER_USERNAME: configuser
          CONFIG_SERVER_PASSWORD: ${{ env.CI_CONFIG_PASSWORD }}
          INTERNAL_HMAC_SECRET: ${{ env.CI_HMAC_SECRET }}
          INTERNAL_REDIS_PASSWORD: ${{ env.CI_REDIS_PASSWORD }}
          SPRING_DATA_REDIS_PASSWORD: ${{ env.CI_REDIS_PASSWORD }}
          JWT_SECRET: ${{ env.CI_JWT_SECRET }}
          SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/hotel_auth
          SPRING_DATASOURCE_USERNAME: native-ci
          SPRING_DATASOURCE_PASSWORD: native-ci
        run: |
          chmod +x ./gradlew
          ./gradlew :config-service:bootJar :auth-service:bootJar :auth-service:test --no-daemon --stacktrace --max-workers=2
          docker build --tag hotel-pms/config-service:ci --file config-service/Dockerfile .
          docker build --tag hotel-pms/auth-service-jvm:ci --file auth-service/Dockerfile .
          docker run --detach --name auth-native-config \
            --restart unless-stopped \
            --publish 8888:8888 --publish 8090:8090 \
            --env SPRING_PROFILES_ACTIVE=native \
            --env CONFIG_SERVER_USERNAME="${CONFIG_SERVER_USERNAME}" \
            --env CONFIG_SERVER_PASSWORD="${CONFIG_SERVER_PASSWORD}" \
            hotel-pms/config-service:ci >/tmp/auth-native-config-container-id
          config_ready=false
          for _ in {1..120}; do
            if ! docker ps --format '{{.Names}}' | grep -qx auth-native-config; then
              echo "Config Server container exited before readiness" >&2
              docker logs auth-native-config >&2 || true
              exit 1
            fi
            if curl --silent --fail --max-time 3 http://127.0.0.1:8090/actuator/health >/dev/null \
              && curl --silent --fail --max-time 3 \
                --user "${CONFIG_SERVER_USERNAME}:${CONFIG_SERVER_PASSWORD}" \
                http://127.0.0.1:8888/auth-service/default >/dev/null; then
              config_ready=true
              break
            fi
            sleep 2
          done
          if [[ "${config_ready}" != true ]]; then
            echo "Config Server did not become ready on ports 8888/8090" >&2
            docker logs auth-native-config >&2 || true
            docker ps -a >&2 || true
            exit 1
          fi
          for _ in {1..10}; do
            if ! docker ps --format '{{.Names}}' | grep -qx auth-native-config \
              || ! curl --silent --fail --max-time 3 \
                --user "${CONFIG_SERVER_USERNAME}:${CONFIG_SERVER_PASSWORD}" \
                http://127.0.0.1:8888/auth-service/default >/dev/null; then
              echo "Config Server container stopped after readiness" >&2
              docker logs auth-native-config >&2 || true
              docker inspect auth-native-config >&2 || true
              docker ps -a >&2 || true
              exit 1
            fi
            sleep 1
          done
          SPRING_PROFILES_ACTIVE=auth-service \
          CONFIG_SERVER_USERNAME="${CONFIG_SERVER_USERNAME}" \
          CONFIG_SERVER_PASSWORD="${CONFIG_SERVER_PASSWORD}" \
            ./gradlew :auth-service:processAot \
              --no-daemon --stacktrace --max-workers=2 \
            || {
              echo "Config Server state after processAot failure" >&2
              docker logs auth-native-config >&2 || true
              docker inspect auth-native-config >&2 || true
              exit 1
            }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Each ubuntu-latest runner invokes one nativeCompile/native-image only.
      # Pull requests use -Ob; the manually dispatched false mode is the final -O2 gate.
      - name: Build Auth Native Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: auth-service/Dockerfile.native
          load: true
          push: false
          tags: hotel-pms/auth-service-native:ci
          build-args: |
            NATIVE_QUICK_BUILD=${{ github.event_name != 'workflow_dispatch' || inputs.native_quick_build }}
            CONFIG_SERVER_URL=http://127.0.0.1:8888
            CONFIG_SERVER_USERNAME=configuser
            CONFIG_SERVER_PASSWORD=${{ env.CI_CONFIG_PASSWORD }}
            INTERNAL_HMAC_SECRET=${{ env.CI_HMAC_SECRET }}
            INTERNAL_REDIS_PASSWORD=${{ env.CI_REDIS_PASSWORD }}
            JWT_SECRET=${{ env.CI_JWT_SECRET }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Native image metadata
        run: |
          docker image inspect hotel-pms/auth-service-native:ci
          docker image inspect hotel-pms/auth-service-native:ci \
            --format 'image_size_bytes={{.Size}}'

      - name: Run Native runtime and integration gate
        env:
          CI_NATIVE_BUILD_MODE: ${{ (github.event_name != 'workflow_dispatch' || inputs.native_quick_build) && 'quick-Ob' || 'optimized-O2' }}
          CI_STABILITY_SECONDS: "300"
        run: bash scripts/ci/verify-auth-native-runtime.sh

      - name: Export validated O2 and JVM images
        if: success() && github.event_name == 'workflow_dispatch' && !inputs.native_quick_build
        run: |
          set -euo pipefail
          export_dir=build/auth-native-images
          mkdir -p "${export_dir}"
          for mode in native jvm; do
            image="hotel-pms/auth-service-${mode}"
            docker tag "${image}:ci" "${image}:validated"
            docker tag "${image}:ci" "${image}:${GITHUB_SHA}"
            docker image inspect "${image}:${GITHUB_SHA}" > "${export_dir}/${mode}-image-inspect.json"
          done
          jq -n --arg commit "${GITHUB_SHA}" --arg run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{commit: $commit, run_url: $run, native_build_mode: "optimized-O2", module: "auth-service", platform: "linux/amd64"}' \
            > "${export_dir}/provenance.json"
          cp build/auth-native-runtime/metrics.txt "${export_dir}/metrics.txt"
          docker save \
            hotel-pms/auth-service-native:validated "hotel-pms/auth-service-native:${GITHUB_SHA}" \
            hotel-pms/auth-service-jvm:validated "hotel-pms/auth-service-jvm:${GITHUB_SHA}" \
            | gzip -1 > "${export_dir}/auth-service-images.tar.gz"
          gzip -t "${export_dir}/auth-service-images.tar.gz"
          tar -xOf "${export_dir}/auth-service-images.tar.gz" manifest.json > "${export_dir}/manifest.json"
          jq -e --arg sha "${GITHUB_SHA}" '[.[].RepoTags[]] as $tags | all(["hotel-pms/auth-service-native:validated", "hotel-pms/auth-service-native:" + $sha, "hotel-pms/auth-service-jvm:validated", "hotel-pms/auth-service-jvm:" + $sha][]; . as $tag | $tags | index($tag) != null)' \
            "${export_dir}/manifest.json"
          (cd "${export_dir}" && sha256sum auth-service-images.tar.gz > SHA256SUMS)

      - name: Upload validated O2 and JVM images
        if: success() && github.event_name == 'workflow_dispatch' && !inputs.native_quick_build
        id: images
        uses: actions/upload-artifact@v4
        with:
          name: auth-native-images-${{ github.sha }}
          path: build/auth-native-images
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - name: Publish runtime metrics
        if: always()
        env:
          IMAGE_ARTIFACT_URL: ${{ steps.images.outputs.artifact-url }}
          IMAGE_ARTIFACT_ID: ${{ steps.images.outputs.artifact-id }}
        run: |
          if [[ -f build/auth-native-runtime/metrics.txt ]]; then
            cat build/auth-native-runtime/metrics.txt >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [[ -f build/auth-native-runtime/failure-class.txt ]]; then
            echo "Failure classification: $(<build/auth-native-runtime/failure-class.txt)" >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [[ -n "${IMAGE_ARTIFACT_ID}" ]]; then
            echo "Validated Native + JVM images: ${IMAGE_ARTIFACT_URL} (artifact ${IMAGE_ARTIFACT_ID})" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-native-runtime-evidence
          path: build/auth-native-runtime
          if-no-files-found: warn

      - name: Clean up integration containers
        if: always()
        run: |
          docker rm --force \
            auth-service-native \
            auth-service-jvm \
            auth-native-redis \
            auth-native-postgres \
            auth-native-config 2>/dev/null || true
          docker network rm auth-native-ci 2>/dev/null || true
