name: F&B Service Native Image

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: One nativeCompile per job; use O2 after a proven quick/runtime gate
        type: choice
        default: optimized-O2
        options:
          - optimized-O2
          - quick-Ob
  pull_request:
    branches:
      - main
    paths:
      - "fb-service/**"
      - "internal-auth-lib/**"
      - "common-web-lib/**"
      - "config-service/**"
      - "frontdesk-service/**"
      - "billing-service/**"
      - "scripts/ci/verify-fb-native-runtime.sh"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/fb-native.yml"

jobs:
  native-build-and-runtime:
    name: Build and validate fb-service Native Image
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write
    env:
      CI_POSTGRES_PASSWORD: native-ci-postgres-password
      CI_REDIS_PASSWORD: native-ci-redis-password
      CI_CONFIG_PASSWORD: native-ci-config-password
      CI_HMAC_SECRET: native-ci-hmac-secret-with-sufficient-length
      CI_NATIVE_BUILD_MODE: ${{ inputs.build_mode || 'quick-Ob' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Record image source
        run: echo "FB_IMAGE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Maven and Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: ${{ runner.os }}-fb-native-jvm21-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-fb-native-jvm21-

      - name: Cheap AOT and JVM tests
        run: |
          chmod +x ./gradlew
          mkdir -p build
          ./gradlew :config-service:bootJar :fb-service:test \
            -x :fb-service:processAot \
            --no-daemon --stacktrace --max-workers=2
          CONFIG_SERVER_PASSWORD="${CI_CONFIG_PASSWORD}" \
            java -jar config-service/build/libs/*-SNAPSHOT.jar \
            > build/fb-config-aot.log 2>&1 &
          config_pid=$!
          trap 'kill "${config_pid}" 2>/dev/null || true' EXIT
          config_ready=false
          for _ in {1..60}; do
            if curl --silent --fail http://127.0.0.1:8090/actuator/health \
                | grep -q '"status":"UP"'; then
              config_ready=true
              break
            fi
            sleep 2
          done
          if [[ "${config_ready}" != true ]]; then
            tail -80 build/fb-config-aot.log
            exit 1
          fi
          CONFIG_SERVER_URL=http://127.0.0.1:8888 \
          CONFIG_SERVER_USERNAME=configuser \
          CONFIG_SERVER_PASSWORD="${CI_CONFIG_PASSWORD}" \
          APPLICATION_CONFIG_FRONTDESK_SERVICE_URL=http://127.0.0.1:8081 \
          APPLICATION_CONFIG_BILLING_SERVICE_URL=http://127.0.0.1:8085 \
          INTERNAL_HMAC_SECRET=test-hmac-secret-minimum-32-characters-for-unit-tests \
          ./gradlew :fb-service:processAot \
            --no-daemon --stacktrace --max-workers=2

      - name: Build real JVM integration dependencies
        run: |
          ./gradlew \
            :config-service:bootJar \
            :frontdesk-service:bootJar \
            :billing-service:bootJar \
            :fb-service:bootJar \
            -x :fb-service:processAot \
            --no-daemon --stacktrace --max-workers=2
          docker build --tag hotel-pms/config-service:ci --file config-service/Dockerfile .
          docker build --tag hotel-pms/frontdesk-service:ci --file frontdesk-service/Dockerfile .
          docker build --tag hotel-pms/billing-service:ci --file billing-service/Dockerfile .
          docker build --tag hotel-pms/fb-service-jvm:ci --file fb-service/Dockerfile .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # A single build step selects Ob or O2. Gate-only changes to already
      # proven code can dispatch O2 directly without another quick compilation.
      - name: Build Native image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: fb-service/Dockerfile.native
          load: true
          push: false
          tags: hotel-pms/fb-service-native:ci
          build-args: |
            NATIVE_QUICK_BUILD=${{ env.CI_NATIVE_BUILD_MODE == 'quick-Ob' }}
            CONFIG_SERVER_URL=http://127.0.0.1:8888
            CONFIG_SERVER_USERNAME=configuser
            CONFIG_SERVER_PASSWORD=${{ env.CI_CONFIG_PASSWORD }}
            INTERNAL_HMAC_SECRET=${{ env.CI_HMAC_SECRET }}
            INTERNAL_REDIS_PASSWORD=${{ env.CI_REDIS_PASSWORD }}
            APPLICATION_CONFIG_FRONTDESK_SERVICE_URL=http://frontdesk-service:8081
            APPLICATION_CONFIG_BILLING_SERVICE_URL=http://billing-service:8085
          cache-from: |
            type=gha,scope=fb-native-${{ env.CI_NATIVE_BUILD_MODE }}
            type=gha
          cache-to: type=gha,scope=fb-native-${{ env.CI_NATIVE_BUILD_MODE }},mode=max

      - name: Verify image metadata
        run: |
          docker image inspect hotel-pms/fb-service-native:ci
          docker image inspect hotel-pms/fb-service-native:ci \
            --format 'image_size_bytes={{.Size}}'

      - name: Run Native and JVM runtime, parity and stability gate
        env:
          FB_IMAGE: hotel-pms/fb-service-native:ci
          NATIVE_METRICS_DIR: build/fb-native-runtime-final
        run: bash scripts/ci/verify-fb-native-runtime.sh

      - name: Export validated O2 and JVM images
        if: success() && env.CI_NATIVE_BUILD_MODE == 'optimized-O2'
        run: |
          set -euo pipefail
          grep -qx 'native_runtime_gate=PASS' build/fb-native-runtime-final/metrics.txt
          export_dir=build/fb-native-images
          mkdir -p "$export_dir"
          tags=()
          for runtime in native jvm; do
            image="hotel-pms/fb-service-${runtime}"
            docker tag "${image}:ci" "${image}:validated"
            docker tag "${image}:ci" "${image}:${FB_IMAGE_SHA}"
            tags+=("${image}:ci" "${image}:validated" "${image}:${FB_IMAGE_SHA}")
          done
          docker image inspect "${tags[@]}" > "$export_dir/image-metadata.json"
          archive="fb-service-optimized-O2-${FB_IMAGE_SHA}.tar.gz"
          docker save "${tags[@]}" | gzip -1 > "$export_dir/$archive"
          (cd "$export_dir" && sha256sum "$archive" > SHA256SUMS && sha256sum --check SHA256SUMS)
          gzip --test "$export_dir/$archive"
          gzip --decompress --stdout "$export_dir/$archive" | tar -xOf - manifest.json \
            > "$export_dir/docker-save-manifest.json"
          jq -e --arg sha "$FB_IMAGE_SHA" '
            [.[].RepoTags[]] as $tags |
            all(["native", "jvm"][]; . as $runtime |
              all(["ci", "validated", $sha][];
                . as $tag | $tags | index("hotel-pms/fb-service-" + $runtime + ":" + $tag)))
          ' "$export_dir/docker-save-manifest.json"
          jq -n --arg commit "$FB_IMAGE_SHA" --arg mode "$CI_NATIVE_BUILD_MODE" \
            --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{service:"fb-service", commit:$commit, build_mode:$mode, run_url:$run_url,
              native_runtime_gate:"PASS", platforms:["linux/amd64"],
              dependencies:["config-server", "redis", "postgres", "frontdesk-service", "billing-service"]}' \
            > "$export_dir/provenance.json"
          cp build/fb-native-runtime-final/metrics.txt "$export_dir/metrics.txt"

      - name: Upload validated O2 and JVM images
        id: images
        if: success() && env.CI_NATIVE_BUILD_MODE == 'optimized-O2'
        uses: actions/upload-artifact@v4
        with:
          name: fb-service-optimized-O2-images-${{ env.FB_IMAGE_SHA }}
          path: build/fb-native-images/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - name: Record downloadable image artifact
        if: success() && env.CI_NATIVE_BUILD_MODE == 'optimized-O2'
        env:
          IMAGE_ARTIFACT_ID: ${{ steps.images.outputs.artifact-id }}
          IMAGE_ARTIFACT_URL: ${{ steps.images.outputs.artifact-url }}
          IMAGE_ARTIFACT_DIGEST: ${{ steps.images.outputs.artifact-digest }}
        run: |
          printf 'image_artifact_id=%s\nimage_artifact_url=%s\nimage_artifact_digest=%s\n' \
            "$IMAGE_ARTIFACT_ID" "$IMAGE_ARTIFACT_URL" "$IMAGE_ARTIFACT_DIGEST" \
            >> build/fb-native-runtime-final/metrics.txt

      - name: Publish Native/JVM metrics
        if: always()
        run: |
          printf '### F&B Native/JVM runtime evidence\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          for metrics in build/fb-native-runtime-final/metrics.txt; do
            if [[ -f "${metrics}" ]]; then
              cat "${metrics}" >> "${GITHUB_STEP_SUMMARY}"
            fi
          done
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Native runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fb-native-runtime-evidence-${{ env.CI_NATIVE_BUILD_MODE }}-${{ env.FB_IMAGE_SHA }}
          path: |
            build/fb-native-runtime-final
            build/fb-config-aot.log
            fb-service/build/test-results/test
          if-no-files-found: error

      - name: Clean up integration containers
        if: always()
        run: |
          docker rm --force \
            fb-native-service fb-jvm-service fb-native-billing fb-native-frontdesk \
            fb-native-redis fb-native-postgres fb-native-config 2>/dev/null || true
          docker network rm fb-native-ci 2>/dev/null || true
