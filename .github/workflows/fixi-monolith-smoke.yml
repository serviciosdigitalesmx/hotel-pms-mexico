name: Fixi Monolith compile and startup smoke

on:
  push:
    branches:
      - codex/fixi-monolith
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fixi-monolith-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile-start-smoke:
    name: Compile, migrate, start, and exercise monolith APIs
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fixi
          POSTGRES_USER: fixi
          POSTGRES_PASSWORD: fixi-monolith-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixi -d fixi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
    steps:
      - name: Checkout branch under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: fixi-monolith-gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: fixi-monolith-gradle-${{ runner.os }}-

      - name: Compile and package the single Spring Boot application
        run: ./gradlew --no-daemon -x processAot -x processAotTest :fixi-monolith:bootJar

      - name: Start against ephemeral PostgreSQL, Redis, and Mailpit; verify APIs
        env:
          DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/fixi
          DATABASE_USERNAME: fixi
          DATABASE_PASSWORD: fixi-monolith-ci
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          MAIL_HOST: 127.0.0.1
          MAIL_PORT: '1025'
          MAIL_SMTP_AUTH: 'false'
          MAIL_STARTTLS: 'false'
          MANAGEMENT_ENDPOINT_HEALTH_SHOW_COMPONENTS: always
          MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
          PORT: '8080'
          ADMIN_USERNAME: e2e-live-other-hotel-admin
          ADMIN_PASSWORD: password
        shell: bash
        run: |
          set -euo pipefail
          export JWT_SECRET="$(openssl rand -base64 48 | tr -d '\n')"
          for attempt in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/1025) >/dev/null 2>&1; then break; fi
            sleep 2
          done
          (echo > /dev/tcp/127.0.0.1/1025) >/dev/null 2>&1
          jar="$(find fixi-monolith/build/libs -maxdepth 1 -name 'fixi-monolith-*.jar' ! -name '*-plain.jar' -print -quit)"
          test -n "$jar"
          java -jar "$jar" > /tmp/fixi-monolith.log 2>&1 &
          app_pid=$!
          cleanup() {
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 120); do
            if curl --silent --show-error --fail http://127.0.0.1:8080/actuator/health > /tmp/fixi-health.json; then
              ready=1
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo 'Monolith process exited before becoming healthy.'
              cat /tmp/fixi-monolith.log
              exit 1
            fi
            sleep 5
          done
          if [[ "$ready" != 1 ]]; then
            echo 'Monolith did not become healthy within 10 minutes.'
            cat /tmp/fixi-monolith.log
            exit 1
          fi
          jq -e '.status == "UP" and .components.db.status == "UP" and .components.redis.status == "UP" and .components.mail.status == "UP"' /tmp/fixi-health.json

          login_status="$(curl --silent --show-error --output /tmp/fixi-login.json --dump-header /tmp/fixi-login.headers --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -X POST http://127.0.0.1:8080/api/v1/auth/login \
            --data "$(jq -nc --arg u "$ADMIN_USERNAME" --arg p "$ADMIN_PASSWORD" '{username:$u,password:$p}')")"
          if [[ "$login_status" != 200 ]]; then
            echo "Auth login returned HTTP $login_status"
            cat /tmp/fixi-login.json
            cat /tmp/fixi-monolith.log
            exit 1
          fi
          token="$(sed -n 's/^[Ss]et-[Cc]ookie: jwt=\([^;]*\).*/\1/p' /tmp/fixi-login.headers | tr -d '\r' | head -n 1)"
          test -n "$token"

          check_get() {
            local label="$1" path="$2" output="$3" status
            status="$(curl --silent --show-error --output "$output" --write-out '%{http_code}' \
              -H "Authorization: Bearer $token" -H "Cookie: jwt=$token" \
              "http://127.0.0.1:8080$path")"
            if [[ "$status" != 200 ]]; then
              echo "$label returned HTTP $status"
              cat "$output"
              return 1
            fi
            echo "$label: HTTP 200"
          }

          check_get 'Auth current-user API' '/api/v1/auth/me' /tmp/fixi-me.json
          check_get 'Customer/guest API' '/api/v1/guests?page=0&size=1' /tmp/fixi-guests.json
          check_get 'Fixi service-orders API' '/api/v1/service-orders?page=0&size=1' /tmp/fixi-orders.json
          check_get 'Inventory products API' '/api/v1/inventory/products' /tmp/fixi-products.json
          check_get 'Billing invoices API' '/api/v1/invoices?page=0&size=1' /tmp/fixi-invoices.json
          check_get 'F&B orders API' '/api/v1/fb/orders?page=0&size=1' /tmp/fixi-fb-orders.json

          sleep 20
          curl --silent --show-error --fail http://127.0.0.1:8080/actuator/health \
            | jq -e '.status == "UP" and .components.db.status == "UP" and .components.redis.status == "UP" and .components.mail.status == "UP"'

          echo 'Health, DB migrations, authenticated login, and exposed module APIs passed.'

      - name: Upload startup logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fixi-monolith-startup-${{ github.run_id }}
          path: /tmp/fixi-monolith.log
          if-no-files-found: warn
          retention-days: 7
