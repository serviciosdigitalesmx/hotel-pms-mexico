name: Fixi Monolith compile and startup smoke

on:
  push:
    branches:
      - codex/fixi-monolith
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fixi-monolith-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile-start-smoke:
    name: Compile, migrate, start, and exercise monolith APIs
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fixi
          POSTGRES_USER: fixi
          POSTGRES_PASSWORD: fixi-monolith-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixi -d fixi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
    steps:
      - name: Checkout branch under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: fixi-monolith-gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: fixi-monolith-gradle-${{ runner.os }}-

      - name: Compile and package the single Spring Boot application
        run: ./gradlew --no-daemon -x processAot -x processAotTest :fixi-monolith:bootJar

      - name: Start against ephemeral PostgreSQL, Redis, and Mailpit; verify APIs
        env:
          DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/fixi
          DATABASE_USERNAME: fixi
          DATABASE_PASSWORD: fixi-monolith-ci
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          MAIL_HOST: 127.0.0.1
          MAIL_PORT: '1025'
          MAIL_SMTP_AUTH: 'false'
          MAIL_STARTTLS: 'false'
          MANAGEMENT_ENDPOINT_HEALTH_SHOW_COMPONENTS: always
          MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
          PORT: '8080'
          ADMIN_USERNAME: e2e-live-other-hotel-admin
          ADMIN_PASSWORD: password
        shell: bash
        run: |
          set -euo pipefail
          export JWT_SECRET="$(openssl rand -base64 48 | tr -d '\n')"
          for attempt in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/1025) >/dev/null 2>&1; then break; fi
            sleep 2
          done
          (echo > /dev/tcp/127.0.0.1/1025) >/dev/null 2>&1
          jar="$(find fixi-monolith/build/libs -maxdepth 1 -name 'fixi-monolith-*.jar' ! -name '*-plain.jar' -print -quit)"
          test -n "$jar"
          java -jar "$jar" > /tmp/fixi-monolith.log 2>&1 &
          app_pid=$!
          cleanup() {
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 120); do
            if curl --silent --show-error --fail http://127.0.0.1:8090/actuator/health > /tmp/fixi-health.json; then
              ready=1
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo 'Monolith process exited before becoming healthy.'
              cat /tmp/fixi-monolith.log
              exit 1
            fi
            sleep 5
          done
          if [[ "$ready" != 1 ]]; then
            echo 'Monolith did not become healthy within 10 minutes.'
            sed -E 's/(Using generated security password: ).*/\1[REDACTED]/' /tmp/fixi-monolith.log
            exit 1
          fi
          if grep -Eqi 'Using generated security password' /tmp/fixi-monolith.log; then
            echo 'Spring Security generated a default development credential during startup.'
            exit 1
          fi
          echo 'No Spring Security generated development credential was emitted.'
          if ! jq -e '.status == "UP" and .components.db.status == "UP" and .components.redis.status == "UP"' /tmp/fixi-health.json; then
            echo 'Monolith health response did not report all required components UP:'
            cat /tmp/fixi-health.json
            exit 1
          fi

          invalid_login_status="$(curl --silent --show-error --output /tmp/fixi-invalid-login.json --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -X POST http://127.0.0.1:8080/api/v1/auth/login \
            --data '{"username":"user","password":"invalid-default-user-probe"}')"
          if [[ "$invalid_login_status" != 401 ]]; then
            echo "Invalid/default-user login returned HTTP $invalid_login_status (expected 401)."
            exit 1
          fi

          unauthenticated_status="$(curl --silent --show-error --output /tmp/fixi-no-jwt.json --write-out '%{http_code}' \
            'http://127.0.0.1:8080/api/v1/customers?page=0&size=1')"
          if [[ "$unauthenticated_status" != 401 && "$unauthenticated_status" != 403 ]]; then
            echo "Protected endpoint without JWT returned HTTP $unauthenticated_status (expected an authentication/authorization rejection: 401 or 403)."
            exit 1
          fi

          basic_auth_status="$(curl --silent --show-error --output /tmp/fixi-basic-auth.json --write-out '%{http_code}' \
            --user 'user:invalid-basic-auth-probe' 'http://127.0.0.1:8080/api/v1/customers?page=0&size=1')"
          if [[ "$basic_auth_status" != 401 && "$basic_auth_status" != 403 ]]; then
            echo "Basic Auth probe returned HTTP $basic_auth_status (expected an authentication/authorization rejection: 401 or 403)."
            exit 1
          fi

          form_login_status="$(curl --silent --show-error --output /tmp/fixi-form-login.html --write-out '%{http_code}' \
            http://127.0.0.1:8080/login)"
          if [[ "$form_login_status" != 401 && "$form_login_status" != 403 && "$form_login_status" != 404 ]]; then
            echo "Default form-login route returned HTTP $form_login_status (expected a denial/not-found response: 401, 403, or 404)."
            exit 1
          fi
          echo 'Invalid login, unauthenticated access, Basic Auth, and default form-login probes were rejected.'

          login_status="$(curl --silent --show-error --output /tmp/fixi-login.json --dump-header /tmp/fixi-login.headers --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -X POST http://127.0.0.1:8080/api/v1/auth/login \
            --data "$(jq -nc --arg u "$ADMIN_USERNAME" --arg p "$ADMIN_PASSWORD" '{username:$u,password:$p}')")"
          if [[ "$login_status" != 200 ]]; then
            echo "Auth login returned HTTP $login_status"
            cat /tmp/fixi-login.json
            sed -E 's/(Using generated security password: ).*/\1[REDACTED]/' /tmp/fixi-monolith.log
            exit 1
          fi
          token="$(sed -n 's/^[Ss]et-[Cc]ookie: jwt=\([^;]*\).*/\1/p' /tmp/fixi-login.headers | tr -d '\r' | head -n 1)"
          test -n "$token"

          baseline_platform_role="$(curl --silent --show-error --fail \
            -H "Cookie: jwt=$token" http://127.0.0.1:8080/api/v1/auth/me | jq -r '.platformRole // empty')"
          if [[ -n "$baseline_platform_role" ]]; then
            echo 'Bootstrap is enabled before explicit operator configuration.'
            exit 1
          fi
          baseline_platform_status="$(curl --silent --show-error --output /tmp/fixi-platform-baseline.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H 'X-Auth-Role: SUPER_ADMIN' \
            -H 'X-Auth-User: forged-platform-operator' \
            -H 'X-Auth-Hotel: 00000000-0000-0000-0000-000000000001' \
            http://127.0.0.1:8080/api/v1/auth/platform/dashboard)"
          if [[ "$baseline_platform_status" != 403 ]]; then
            echo "Tenant admin JWT plus forged platform headers returned HTTP $baseline_platform_status (expected 403)."
            exit 1
          fi
          echo 'Bootstrap is disabled by default; tenant role and forged identity headers do not grant platform access.'

          check_get() {
            local label="$1" path="$2" output="$3" status
            status="$(curl --silent --show-error --output "$output" --write-out '%{http_code}' \
              -H "Authorization: Bearer $token" -H "Cookie: jwt=$token" \
              "http://127.0.0.1:8080$path")"
            if [[ "$status" != 200 ]]; then
              echo "$label returned HTTP $status"
              cat "$output"
              return 1
            fi
            echo "$label: HTTP 200"
          }

          check_get 'Auth current-user API' '/api/v1/auth/me' /tmp/fixi-me.json
          check_get 'Fixi customers API' '/api/v1/customers?page=0&size=1' /tmp/fixi-customers.json
          check_get 'Fixi service-orders API' '/api/v1/service-orders?page=0&size=1' /tmp/fixi-orders.json
          check_get 'Inventory products API' '/api/v1/inventory/products' /tmp/fixi-products.json
          check_get 'Billing invoices API' '/api/v1/invoices?page=0&size=1' /tmp/fixi-invoices.json
          check_get 'F&B orders API' '/api/v1/fb/orders?page=0&size=1' /tmp/fixi-fb-orders.json

          sleep 20
          curl --silent --show-error --fail http://127.0.0.1:8090/actuator/health \
            | jq -e '.status == "UP" and .components.db.status == "UP" and .components.redis.status == "UP"'

          # Explicitly enable one-time bootstrap only for this disposable CI database.
          kill "$app_pid"
          wait "$app_pid" 2>/dev/null || true
          FIXI_PLATFORM_BOOTSTRAP_ENABLED=true \
          FIXI_PLATFORM_BOOTSTRAP_USERNAME="$ADMIN_USERNAME" \
            java -jar "$jar" > /tmp/fixi-monolith-platform-bootstrap.log 2>&1 &
          app_pid=$!
          ready=0
          for attempt in $(seq 1 120); do
            if curl --silent --show-error --fail http://127.0.0.1:8090/actuator/health/readiness >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo 'Monolith exited during explicit Super Admin bootstrap.'
              sed -E 's/(Using generated security password: ).*/\1[REDACTED]/' /tmp/fixi-monolith-platform-bootstrap.log
              exit 1
            fi
            sleep 5
          done
          if [[ "$ready" != 1 ]]; then
            echo 'Monolith did not become ready during explicit Super Admin bootstrap.'
            sed -E 's/(Using generated security password: ).*/\1[REDACTED]/' /tmp/fixi-monolith-platform-bootstrap.log
            exit 1
          fi
          if grep -Eqi 'Using generated security password' /tmp/fixi-monolith-platform-bootstrap.log; then
            echo 'Spring Security generated a default development credential during Super Admin bootstrap.'
            exit 1
          fi

          login_status="$(curl --silent --show-error --output /tmp/fixi-platform-login.json --dump-header /tmp/fixi-platform-login.headers --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -X POST http://127.0.0.1:8080/api/v1/auth/login \
            --data "$(jq -nc --arg u "$ADMIN_USERNAME" --arg p "$ADMIN_PASSWORD" '{username:$u,password:$p}')")"
          if [[ "$login_status" != 200 ]]; then
            echo "Platform bootstrap account login returned HTTP $login_status."
            exit 1
          fi
          platform_token="$(sed -n 's/^[Ss]et-[Cc]ookie: jwt=\([^;]*\).*/\1/p' /tmp/fixi-platform-login.headers | tr -d '\r' | head -n 1)"
          if [[ -z "$platform_token" ]]; then
            echo 'Platform bootstrap login returned HTTP 200 but did not set the expected JWT cookie.'
            exit 1
          fi
          platform_me_status="$(curl --silent --show-error --output /tmp/fixi-platform-me.json --write-out '%{http_code}' \
            -H "Cookie: jwt=$platform_token" http://127.0.0.1:8080/api/v1/auth/me)"
          if [[ "$platform_me_status" != 200 ]]; then
            echo "Current-user endpoint after bootstrap login returned HTTP $platform_me_status."
            exit 1
          fi
          platform_role="$(jq -r '.platformRole // empty' /tmp/fixi-platform-me.json)"
          if [[ "$platform_role" != 'SUPER_ADMIN' ]]; then
            echo "Persisted bootstrap login returned platformRole=${platform_role:-absent}, expected SUPER_ADMIN."
            echo 'Explicit persisted bootstrap did not issue the server-validated SUPER_ADMIN claim.'
            exit 1
          fi
          echo 'Explicit bootstrap login and persisted SUPER_ADMIN claim verified.'

          assert_json() {
            local label="$1"
            shift
            if ! jq -e "$@" >/dev/null; then
              echo "Platform smoke JSON assertion failed: $label."
              return 1
            fi
          }

          platform_get() {
            local path="$1" output="$2" status
            status="$(curl --silent --show-error --output "$output" --write-out '%{http_code}' \
              -H "Authorization: Bearer $platform_token" "http://127.0.0.1:8080$path")"
            if [[ "$status" != 200 ]]; then
              echo "Platform GET $path returned HTTP $status."
              cat "$output"
              return 1
            fi
          }
          platform_mutate() {
            local method="$1" path="$2" body="$3" expected_status="$4" output="$5" status
            status="$(curl --silent --show-error --output "$output" --write-out '%{http_code}' \
              -H "Authorization: Bearer $platform_token" -H 'Content-Type: application/json' \
              -X "$method" "http://127.0.0.1:8080$path" --data "$body")"
            if [[ "$status" != "$expected_status" ]]; then
              echo "Platform $method $path returned HTTP $status (expected $expected_status)."
              cat "$output"
              return 1
            fi
          }

          platform_get '/api/v1/auth/platform/dashboard' /tmp/fixi-platform-dashboard.json
          assert_json 'dashboard totals' '.tenantsTotal > 0 and .usersTotal > 0 and .ownersTotal > 0' \
            /tmp/fixi-platform-dashboard.json
          platform_get '/api/v1/auth/platform/tenants?page=0&size=10' /tmp/fixi-platform-tenants.json
          platform_get '/api/v1/auth/platform/hotels' /tmp/fixi-platform-hotels.json
          platform_get '/api/v1/auth/platform/plans' /tmp/fixi-platform-plans.json
          platform_get '/api/v1/auth/platform/users?page=0&size=10' /tmp/fixi-platform-users.json
          platform_get '/api/v1/auth/platform/audit?page=0&size=50' /tmp/fixi-platform-bootstrap-audit.json
          assert_json 'bootstrap audit event' \
            '[.content[].action] | index("SUPER_ADMIN_BOOTSTRAPPED") != null' \
            /tmp/fixi-platform-bootstrap-audit.json
          assert_json 'bootstrap audit metadata redaction' \
            '[.content[].metadataJson | test("password|token|cookie|secret"; "i")] | any | not' \
            /tmp/fixi-platform-bootstrap-audit.json
          if jq -e '[.content[] | has("password") or has("passwordHash") or has("token") or has("refreshToken") or has("tokenVersion")] | any' \
            /tmp/fixi-platform-users.json >/dev/null; then
            echo 'Global user directory exposed authentication-sensitive fields.'
            exit 1
          fi
          echo 'Platform dashboard, directories, audit, and safe user fields verified.'

          run_tag="${GITHUB_RUN_ID:-local}"
          tenant_slug="fixi-ci-$run_tag"
          owner_username="fixi-owner-$run_tag"
          owner_email="fixi-owner-$run_tag@example.test"
          temporary_owner_password='TempOwner123'
          owner_password='OwnerStrong123'
          create_body="$(jq -nc --arg name "Fixi CI $run_tag" --arg slug "$tenant_slug" \
            --arg username "$owner_username" --arg email "$owner_email" \
            --arg password "$temporary_owner_password" \
            '{name:$name,slug:$slug,ownerUsername:$username,ownerEmail:$email,initialPassword:$password}')"
          platform_mutate POST '/api/v1/auth/platform/hotels' "$create_body" 201 /tmp/fixi-platform-created-tenant.json
          if ! tenant_id="$(jq -er '.id' /tmp/fixi-platform-created-tenant.json)"; then
            echo 'Tenant creation response did not contain an id.'
            exit 1
          fi
          assert_json 'created tenant slug' --arg slug "$tenant_slug" \
            '.slug == $slug' /tmp/fixi-platform-created-tenant.json
          platform_get "/api/v1/auth/platform/tenants/$tenant_id" /tmp/fixi-platform-tenant-detail.json
          platform_get "/api/v1/auth/platform/tenants?search=$tenant_slug&page=0&size=10" /tmp/fixi-platform-tenant-search.json
          assert_json 'tenant search result' --arg id "$tenant_id" \
            '[.content[].id] | index($id) != null' /tmp/fixi-platform-tenant-search.json

          plan_body='{"planKey":"qa-validation-plan"}'
          platform_mutate PUT "/api/v1/auth/platform/tenants/$tenant_id/plan" "$plan_body" 200 /tmp/fixi-platform-plan-assigned.json
          assert_json 'assigned tenant plan' \
            '.planKey == "qa-validation-plan" and .planActive == true' \
            /tmp/fixi-platform-plan-assigned.json
          platform_get "/api/v1/auth/platform/tenants/$tenant_id/subscriptions?page=0&size=10" /tmp/fixi-platform-tenant-subscriptions.json
          assert_json 'tenant plan history' \
            '[.content[].planKey] | index("qa-validation-plan") != null' \
            /tmp/fixi-platform-tenant-subscriptions.json
          platform_get '/api/v1/auth/platform/subscriptions?page=0&size=20' /tmp/fixi-platform-subscriptions.json
          assert_json 'global subscription history' --arg id "$tenant_id" \
            '[.content[].tenantId] | index($id) != null' /tmp/fixi-platform-subscriptions.json
          echo 'Tenant creation, search, plan assignment, and subscription history verified.'

          owner_login_status="$(curl --silent --show-error --output /tmp/fixi-platform-owner-login.json --dump-header /tmp/fixi-platform-owner-login.headers --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -X POST http://127.0.0.1:8080/api/v1/auth/login \
            --data "$(jq -nc --arg u "$owner_username" --arg p "$temporary_owner_password" '{username:$u,password:$p}')")"
          if [[ "$owner_login_status" != 200 ]] || ! jq -e '.mustChangePassword == true' /tmp/fixi-platform-owner-login.json >/dev/null; then
            echo "New tenant owner did not receive the expected first-login password-change state (HTTP $owner_login_status)."
            exit 1
          fi
          owner_token="$(sed -n 's/^[Ss]et-[Cc]ookie: jwt=\([^;]*\).*/\1/p' /tmp/fixi-platform-owner-login.headers | tr -d '\r' | head -n 1)"
          owner_csrf="$(sed -n 's/^[Ss]et-[Cc]ookie: csrf_token=\([^;]*\).*/\1/p' /tmp/fixi-platform-owner-login.headers | tr -d '\r' | head -n 1)"
          test -n "$owner_token" && test -n "$owner_csrf"
          change_password_status="$(curl --silent --show-error --output /tmp/fixi-platform-owner-password-change.json --dump-header /tmp/fixi-platform-owner-password-change.headers --write-out '%{http_code}' \
            -H "Cookie: jwt=$owner_token; csrf_token=$owner_csrf" -H "X-CSRF-Token: $owner_csrf" \
            -H 'Content-Type: application/json' -X POST http://127.0.0.1:8080/api/v1/auth/change-password \
            --data "$(jq -nc --arg current "$temporary_owner_password" --arg next "$owner_password" '{currentPassword:$current,newPassword:$next}')")"
          if [[ "$change_password_status" != 200 ]]; then
            echo "New tenant owner could not complete the required password change (HTTP $change_password_status)."
            cat /tmp/fixi-platform-owner-password-change.json
            exit 1
          fi
          owner_token="$(sed -n 's/^[Ss]et-[Cc]ookie: jwt=\([^;]*\).*/\1/p' /tmp/fixi-platform-owner-password-change.headers | tr -d '\r' | head -n 1)"
          owner_refresh="$(sed -n 's/^[Ss]et-[Cc]ookie: refresh_token=\([^;]*\).*/\1/p' /tmp/fixi-platform-owner-password-change.headers | tr -d '\r' | head -n 1)"
          test -n "$owner_token" && test -n "$owner_refresh"

          suspend_body='{"status":"SUSPENDED"}'
          platform_mutate PATCH "/api/v1/auth/platform/tenants/$tenant_id/status" "$suspend_body" 200 /tmp/fixi-platform-suspended.json
          assert_json 'tenant suspension state' '.status == "SUSPENDED"' /tmp/fixi-platform-suspended.json
          suspended_login_status="$(curl --silent --show-error --output /tmp/fixi-platform-suspended-login.json --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -X POST http://127.0.0.1:8080/api/v1/auth/login \
            --data "$(jq -nc --arg u "$owner_username" --arg p "$owner_password" '{username:$u,password:$p}')")"
          if [[ "$suspended_login_status" != 401 ]]; then
            echo "New login for suspended tenant returned HTTP $suspended_login_status (expected 401)."
            exit 1
          fi
          suspended_refresh_status="$(curl --silent --show-error --output /tmp/fixi-platform-suspended-refresh.json --write-out '%{http_code}' \
            -H "Cookie: refresh_token=$owner_refresh" -X POST http://127.0.0.1:8080/api/v1/auth/refresh)"
          if [[ "$suspended_refresh_status" != 401 ]]; then
            echo "Refresh for suspended tenant returned HTTP $suspended_refresh_status (expected 401)."
            exit 1
          fi
          suspended_session_status="$(curl --silent --show-error --output /tmp/fixi-platform-suspended-session.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $owner_token" -H "Cookie: jwt=$owner_token" \
            'http://127.0.0.1:8080/api/v1/customers?page=0&size=1')"
          if [[ "$suspended_session_status" != 403 ]]; then
            echo "Existing tenant access token during suspension returned HTTP $suspended_session_status (expected 403)."
            exit 1
          fi
          platform_get "/api/v1/auth/platform/tenants/$tenant_id" /tmp/fixi-platform-suspended-admin-read.json
          assert_json 'suspended tenant remains persisted' \
            '.status == "SUSPENDED"' /tmp/fixi-platform-suspended-admin-read.json

          activate_body='{"status":"ACTIVE"}'
          platform_mutate PATCH "/api/v1/auth/platform/tenants/$tenant_id/status" "$activate_body" 200 /tmp/fixi-platform-reactivated.json
          assert_json 'tenant reactivation state' '.status == "ACTIVE"' /tmp/fixi-platform-reactivated.json
          reactivated_login_status="$(curl --silent --show-error --output /tmp/fixi-platform-reactivated-login.json --dump-header /tmp/fixi-platform-reactivated-login.headers --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -X POST http://127.0.0.1:8080/api/v1/auth/login \
            --data "$(jq -nc --arg u "$owner_username" --arg p "$owner_password" '{username:$u,password:$p}')")"
          if [[ "$reactivated_login_status" != 200 ]]; then
            echo "Tenant owner login after reactivation returned HTTP $reactivated_login_status (expected 200)."
            exit 1
          fi
          reactivated_owner_token="$(sed -n 's/^[Ss]et-[Cc]ookie: jwt=\([^;]*\).*/\1/p' /tmp/fixi-platform-reactivated-login.headers | tr -d '\r' | head -n 1)"
          test -n "$reactivated_owner_token"
          reactivated_tenant_status="$(curl --silent --show-error --output /tmp/fixi-platform-reactivated-tenant.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $reactivated_owner_token" -H "Cookie: jwt=$reactivated_owner_token" \
            'http://127.0.0.1:8080/api/v1/customers?page=0&size=1')"
          if [[ "$reactivated_tenant_status" != 200 ]]; then
            echo "Tenant API access after reactivation returned HTTP $reactivated_tenant_status (expected 200)."
            cat /tmp/fixi-platform-reactivated-tenant.json
            exit 1
          fi

          platform_get "/api/v1/auth/platform/users?search=$owner_username&page=0&size=10" /tmp/fixi-platform-owner-directory.json
          assert_json 'tenant owner appears in global user directory' \
            --arg username "$owner_username" '[.content[].username] | index($username) != null' \
            /tmp/fixi-platform-owner-directory.json
          platform_get "/api/v1/auth/platform/audit?tenantId=$tenant_id&page=0&size=50" /tmp/fixi-platform-audit.json
          for action in TENANT_CREATED TENANT_PLAN_ASSIGNED TENANT_SUSPENDED TENANT_REACTIVATED; do
            assert_json "audit action $action" --arg action "$action" \
              '[.content[].action] | index($action) != null' /tmp/fixi-platform-audit.json
          done
          assert_json 'tenant lifecycle audit metadata redaction' \
            '[.content[].metadataJson | test("password|token|cookie|secret"; "i")] | any | not' \
            /tmp/fixi-platform-audit.json
          echo 'Owner first-login, suspension/reactivation, and tenant audit flows verified.'

          # Reboot into the production seed-cleanup mode and prove that the fixed
          # E2E logins and their explicit bootstrap grants cannot authenticate.
          kill "$app_pid"
          wait "$app_pid" 2>/dev/null || true
          FIXI_BOOTSTRAP_REMOVE_TEST_USERS_ON_STARTUP=true java -jar "$jar" > /tmp/fixi-monolith-production-startup.log 2>&1 &
          app_pid=$!
          ready=0
          for attempt in $(seq 1 120); do
            if curl --silent --show-error --fail http://127.0.0.1:8090/actuator/health/readiness >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo 'Monolith exited during production seed-cleanup startup.'
              sed -E 's/(Using generated security password: ).*/\1[REDACTED]/' /tmp/fixi-monolith-production-startup.log
              exit 1
            fi
            sleep 5
          done
          if [[ "$ready" != 1 ]]; then
            echo 'Monolith did not become ready after production seed cleanup.'
            sed -E 's/(Using generated security password: ).*/\1[REDACTED]/' /tmp/fixi-monolith-production-startup.log
            exit 1
          fi
          if grep -Eqi 'Using generated security password' /tmp/fixi-monolith-production-startup.log; then
            echo 'Spring Security generated a default development credential in production seed-cleanup mode.'
            exit 1
          fi
          for seeded_username in "$ADMIN_USERNAME" admin; do
            production_login_status="$(curl --silent --show-error --output /tmp/fixi-production-login.json --write-out '%{http_code}' \
              -H 'Content-Type: application/json' -X POST http://127.0.0.1:8080/api/v1/auth/login \
              --data "$(jq -nc --arg u "$seeded_username" --arg p "$ADMIN_PASSWORD" '{username:$u,password:$p}')")"
            if [[ "$production_login_status" != 401 ]]; then
              echo "A seeded test account remained usable in production mode (HTTP $production_login_status)."
              cat /tmp/fixi-production-login.json
              sed -E 's/(Using generated security password: ).*/\1[REDACTED]/' /tmp/fixi-monolith-production-startup.log
              exit 1
            fi
          done

          echo 'Health, DB migrations, authenticated module smoke, and production test-seed removal passed.'

      - name: Redact generated Spring credentials from startup diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for file in /tmp/fixi-monolith.log /tmp/fixi-monolith-platform-bootstrap.log /tmp/fixi-monolith-production-startup.log; do
            if [[ -f "$file" ]]; then
              sed -E 's/(Using generated security password: ).*/\1[REDACTED]/' "$file" > "${file}.redacted"
              mv "${file}.redacted" "$file"
            fi
          done

      - name: Upload startup logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fixi-monolith-startup-${{ github.run_id }}
          path: |
            /tmp/fixi-monolith.log
            /tmp/fixi-monolith-platform-bootstrap.log
            /tmp/fixi-monolith-production-startup.log
          if-no-files-found: warn
          retention-days: 7
