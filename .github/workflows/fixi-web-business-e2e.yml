name: Fixi Web Business E2E

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: fixi-web-business-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  business-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      POSTGRES_PASSWORD: fixi-web-ci-postgres
      REDIS_PASSWORD: fixi-web-ci-redis
      CONFIG_SERVER_PASSWORD: fixi-web-ci-config
      INTERNAL_HMAC_SECRET: fixi-web-ci-hmac-secret-with-sufficient-length
      JWT_SECRET: TmF0aXZlQXV0aC1jaS1qd3Qtc2VjcmV0LXdpdGgtc3VmaWNpZW50LWxlbmd0aA==
      NATIVE_ADMIN_USERNAME: e2e-live-other-hotel-admin
      NATIVE_ADMIN_PASSWORD: password
      PLAYWRIGHT_NATIVE_BASE_URL: http://127.0.0.1:18080
      NATIVE_API_BASE_URL: http://127.0.0.1:18080
      GW_CORS_ALLOWED_ORIGINS: http://127.0.0.1:18080
      GW_DEFAULT_RATE_LIMIT_REPLENISH_RATE: '60'
      GW_DEFAULT_RATE_LIMIT_BURST_CAPACITY: '120'
      GW_AUTH_RATE_LIMIT_REPLENISH_RATE: '30'
      GW_AUTH_RATE_LIMIT_BURST_CAPACITY: '60'
      NATIVE_E2E_OUTPUT_DIR: ${{ github.workspace }}/build/fixi-web-business-e2e/playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build current backend commit
        run: >-
          ./gradlew --no-daemon -x processAot -x processAotTest
          :config-service:bootJar :api-gateway:bootJar :auth-service:bootJar
          :guest-service:bootJar :frontdesk-service:bootJar :billing-service:bootJar
          :fb-service:bootJar :notification-service:bootJar
      - name: Install frontend and Playwright dependencies
        working-directory: frontend
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Build isolated frontend image
        run: docker build --tag hotel-pms/frontend:business-ci frontend
      - name: Start isolated source-built stack
        run: |
          compose=(docker compose --project-name "fixi-web-${GITHUB_RUN_ID}" \
            -f docker-compose.yml -f docker-compose.web-business-e2e.yml)
          "${compose[@]}" up -d --build --wait --wait-timeout 900 \
            postgres redis config-server api-gateway auth-service guest-service frontdesk-service billing-service fb-service notification-service fixi-mail frontend || {
              echo 'Source-built Web Business E2E stack failed to become ready.'
              "${compose[@]}" ps --all || true
              "${compose[@]}" logs --no-color --tail=300 || true
              exit 1
            }
      - name: Run integrated Playwright business flows against real APIs
        working-directory: frontend
        run: pnpm exec playwright test --config playwright-native.config.ts
      - name: Collect business E2E evidence
        if: always()
        run: |
          mkdir -p build/fixi-web-business-e2e
          compose=(docker compose --project-name "fixi-web-${GITHUB_RUN_ID}" \
            -f docker-compose.yml -f docker-compose.web-business-e2e.yml)
          "${compose[@]}" ps --all > build/fixi-web-business-e2e/containers.txt || true
          "${compose[@]}" logs --no-color > build/fixi-web-business-e2e/backend.log || true
          printf 'FIXI WEB BUSINESS E2E\ncommit=%s\nworkflow=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            > build/fixi-web-business-e2e/business-e2e-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: business-e2e-report
          path: build/fixi-web-business-e2e
          if-no-files-found: warn
      - name: Destroy isolated stack
        if: always()
        run: docker compose --project-name "fixi-web-${GITHUB_RUN_ID}" -f docker-compose.yml -f docker-compose.web-business-e2e.yml down -v --remove-orphans
