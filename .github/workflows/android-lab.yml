name: Fixi Android real backend lab
# Run only after the Native publisher succeeds, and consume that exact source SHA.

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Publish Fixi Native Images (Parallel)]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: fixi-android-lab
  cancel-in-progress: true

jobs:
  android-lab:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      NATIVE_STACK_MODE: native
      POSTGRES_PASSWORD: fixi-android-ci-postgres
      REDIS_PASSWORD: fixi-android-ci-redis
      CONFIG_SERVER_PASSWORD: fixi-android-ci-config
      INTERNAL_HMAC_SECRET: fixi-android-ci-hmac-secret-with-sufficient-length
      JWT_SECRET: TmF0aXZlQXV0aC1jaS1qd3Qtc2VjcmV0LXdpdGgtc3VmZmljaWVudC1sZW5ndGg=
      GHCR_OWNER: serviciosdigitalesmx
      FIXI_NATIVE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start real Native backend
        run: |
          [[ "$FIXI_NATIVE_TAG" =~ ^[0-9a-f]{40}$ ]]
          docker compose --project-name "fixi-android-${GITHUB_RUN_ID}" \
            -f docker-compose.yml -f docker-compose.android-lab.yml \
            up -d --no-build --wait --wait-timeout 600 \
            postgres redis config-server api-gateway auth-service guest-service frontdesk-service billing-service fb-service notification-service || {
              docker compose --project-name "fixi-android-${GITHUB_RUN_ID}" -f docker-compose.yml -f docker-compose.android-lab.yml ps --all
              docker compose --project-name "fixi-android-${GITHUB_RUN_ID}" -f docker-compose.yml -f docker-compose.android-lab.yml logs --no-color --tail=300 notification-service config-server postgres notification-db-init
              exit 1
            }
          curl --fail --retry 20 --retry-delay 3 http://127.0.0.1:18101/actuator/health/liveness
      - name: Configure Android SDK and build APK
        working-directory: fixi-android
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" platform-tools "platforms;android-35" "build-tools;35.0.0" "emulator" "system-images;android-33;google_apis;x86_64"
          gradle wrapper --gradle-version 8.11.1
          chmod +x ./gradlew
          ./gradlew assembleCiDebug --stacktrace 2>&1 | tee android-build.log
      - name: Run emulator and install APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          disable-linux-hw-accel: true
          emulator-boot-timeout: 1200
          script: |
            adb install -r fixi-android/app/build/outputs/apk/ci/debug/*.apk
            adb shell am force-stop mx.fixi.app
            set +e
            adb shell am start -W -n mx.fixi.app/.MainActivity > fixi-launch.txt 2>&1
            launch_status=$?
            adb shell dumpsys activity activities > fixi-activity.txt 2>&1
            activity_status=$?
            adb logcat -d -t 500 > fixi-logcat.txt 2>&1
            logcat_status=$?
            APP_PID="$(adb shell pidof mx.fixi.app | tr -d '\r')"
            set -e
            cat fixi-launch.txt
            if [ "$launch_status" -ne 0 ]; then
              echo "Fixi Android launcher activity failed to start"
              exit "$launch_status"
            fi
            if [ "$activity_status" -ne 0 ]; then
              echo "Could not capture Android activity state"
              exit "$activity_status"
            fi
            if [ "$logcat_status" -ne 0 ]; then
              echo "Could not capture Android logcat"
              exit "$logcat_status"
            fi
            test -n "$APP_PID"
            grep -Eq 'mResumedActivity.*mx\.fixi\.app|ResumedActivity.*mx\.fixi\.app' fixi-activity.txt
            if grep -Fq 'Process: mx.fixi.app' fixi-logcat.txt; then
              echo "Fixi Android process crashed during the emulator smoke run"
              exit 1
            fi
      - name: Collect backend and emulator evidence
        if: always()
        run: |
          docker compose --project-name "fixi-android-${GITHUB_RUN_ID}" \
            -f docker-compose.yml -f docker-compose.android-lab.yml ps --all > backend-containers.txt
          docker compose --project-name "fixi-android-${GITHUB_RUN_ID}" \
            -f docker-compose.yml -f docker-compose.android-lab.yml logs --no-color > backend.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixi-android-lab-evidence
          path: |
            fixi-android/app/build/outputs/apk/ci/debug/*.apk
            fixi-android/android-build.log
            fixi-launch.txt
            fixi-logcat.txt
            fixi-activity.txt
            backend-containers.txt
            backend.log
          if-no-files-found: error
      - name: Destroy disposable backend lab
        if: always()
        run: docker compose --project-name "fixi-android-${GITHUB_RUN_ID}" -f docker-compose.yml -f docker-compose.android-lab.yml down -v --remove-orphans
