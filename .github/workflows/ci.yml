name: CI Quality Gate

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
      - feature/secure-coding-hardening
      - 'codex/**'
  pull_request:
    branches:
      - main


# ══════════════════════════════════════════════════════════════════════════════
jobs:

  # ── Job 1: Backend ──────────────────────────────────────────────────────────
  backend:
    name: "Backend — Build · PMD · Checkstyle · JUnit"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "21"
          distribution: temurin

      - name: Cache Gradle packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build all modules (PMD + Checkstyle + JUnit + JaCoCo)
        # Native-enabled modules wire processAot into the standard lifecycle.
        # Keep this JVM quality gate independent from Config Server; each
        # Native workflow runs its own explicit AOT preflight with dependencies.
        run: ./gradlew build --no-daemon -x processAot -x processAotTest

      - name: Upload test and quality reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-reports
          path: |
            **/build/reports/tests/
            **/build/reports/pmd/
            **/build/reports/checkstyle/
            **/build/reports/spotbugs/
            **/build/reports/jacoco/
          retention-days: 14

      # Trivy and E2E jobs download this artifact to build Docker images
      # without re-running Gradle (avoids Maven Central rate limiting).
      - name: Upload Spring Boot JARs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: spring-boot-jars
          path: "**/build/libs/*-SNAPSHOT.jar"
          retention-days: 1
          if-no-files-found: error

  # ── Job 2: Frontend ─────────────────────────────────────────────────────────
  frontend:
    name: "Frontend — ESLint · TypeScript · Vitest"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: ESLint — zero warnings policy
        working-directory: frontend
        run: pnpm run lint

      - name: TypeScript check + production build
        working-directory: frontend
        run: pnpm run build

      - name: Unit tests — Vitest (with coverage thresholds)
        working-directory: frontend
        run: pnpm run test:coverage

  # ── Job 3: Container Image Scan ──────────────────────────────────────────────
  # Scans all 10 custom Docker images for OS/library CVEs (CRITICAL + HIGH).
  # Uses a matrix strategy to scan each image in parallel.
  # Uploads SARIF results to GitHub Security tab for centralised tracking.
  # Also runs a misconfig scan on each Dockerfile (warn-only).
  # ─────────────────────────────────────────────────────────────────────────────
  trivy:
    name: "Trivy — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs: [backend]
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: config-service
            dockerfile: config-service/Dockerfile
            image: hotel-pms/config-service
            context: "."
          - service: api-gateway
            dockerfile: api-gateway/Dockerfile
            image: hotel-pms/api-gateway
            context: "."
          - service: auth-service
            dockerfile: auth-service/Dockerfile
            image: hotel-pms/auth-service
            context: "."
          - service: guest-service
            dockerfile: guest-service/Dockerfile
            image: hotel-pms/guest-service
            context: "."
          - service: frontdesk-service
            dockerfile: frontdesk-service/Dockerfile
            image: hotel-pms/frontdesk-service
            context: "."
          - service: billing-service
            dockerfile: billing-service/Dockerfile
            image: hotel-pms/billing-service
            context: "."
          - service: fb-service
            dockerfile: fb-service/Dockerfile
            image: hotel-pms/fb-service
            context: "."
          - service: frontend
            dockerfile: frontend/Dockerfile
            image: hotel-pms/frontend
            context: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Restore the pre-built JARs from the backend job so docker build
      # can COPY them without running Gradle (avoids Maven Central calls).
      # Frontend matrix entry ignores the JARs; its Dockerfile uses context ./frontend.
      - name: Download Spring Boot JARs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: spring-boot-jars
          path: .

      - name: Cache Trivy DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      - name: Build Docker image — ${{ matrix.service }}
        run: |
          docker build \
            -t ${{ matrix.image }}:ci \
            -f ${{ matrix.dockerfile }} \
            ${{ matrix.context }}

      - name: Trivy vulnerability scan — ${{ matrix.service }}
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: "${{ matrix.image }}:ci"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          timeout: "10m0s"

      - name: Trivy SARIF scan — ${{ matrix.service }}
        if: always()
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: "${{ matrix.image }}:ci"
          format: "sarif"
          output: "trivy-${{ matrix.service }}.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          timeout: "10m0s"

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        with:
          sarif_file: "trivy-${{ matrix.service }}.sarif"
          category: "trivy-${{ matrix.service }}"

      - name: Trivy misconfig scan — ${{ matrix.service }}
        if: always()
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: "config"
          scan-ref: "${{ matrix.dockerfile }}"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

  # ── Job 4: Third-party Image Scan ──────────────────────────────────────────
  # Warn-only scan of critical third-party images used in docker-compose.yml.
  # Non-blocking: we don't control upstream release cycles, but we want
  # visibility into CVEs in our infrastructure dependencies.
  # ─────────────────────────────────────────────────────────────────────────────
  trivy-thirdparty:
    name: "Trivy 3rd-party — ${{ matrix.image }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        image:
          - postgres:15-alpine
          - redis:8.8.1-alpine
          - grafana/grafana:13.1.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache Trivy DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      - name: Trivy scan — ${{ matrix.image }}
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: "${{ matrix.image }}"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          timeout: "10m0s"

      - name: Trivy SARIF scan — ${{ matrix.image }}
        if: always()
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: "${{ matrix.image }}"
          format: "sarif"
          output: "trivy-thirdparty-${{ strategy.job-index }}.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          timeout: "10m0s"

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        with:
          sarif_file: "trivy-thirdparty-${{ strategy.job-index }}.sarif"
          category: "trivy-thirdparty-${{ matrix.image }}"

  # ── Job 5: Fixi integrated Docker E2E ───────────────────────────────────────
  # Reuse the Fixi-specific real-API Docker stack workflow. The old generic
  # frontend/e2e suite targets the retired hotel-PMS routes and is not Fixi CI.
  e2e:
    name: "Fixi Web Business E2E — Docker Stack"
    needs: [backend, frontend, trivy]
    permissions:
      contents: read
    uses: ./.github/workflows/fixi-web-business-e2e.yml
