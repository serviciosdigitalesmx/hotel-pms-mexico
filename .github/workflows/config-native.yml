name: Config Service Native Image

on:
  workflow_dispatch:
    inputs:
      native_build_mode:
        description: "Native gate mode: quick (-Ob) or final (-O2)"
        required: true
        default: quick
        type: choice
        options:
          - quick
          - optimized
  pull_request:
    branches:
      - main
    paths:
      - "config-service/**"
      - "scripts/ci/verify-config-native-runtime.sh"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/config-native.yml"

jobs:
  native-build-and-runtime:
    name: Build and validate config-service Native Image
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write
    env:
      CI_CONFIG_PASSWORD: native-ci-config-password
      NATIVE_BUILD_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.native_build_mode || 'quick' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # This is the only dependency-cache mechanism in this workflow.
      - name: Cache Maven and Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: ${{ runner.os }}-config-native-jvm21-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-config-native-jvm21-

      - name: Run JVM tests and cheap Spring AOT processing
        run: |
          chmod +x ./gradlew
          CONFIG_SERVER_PASSWORD="${CI_CONFIG_PASSWORD}" ./gradlew \
            :config-service:test \
            :config-service:processAot \
            :config-service:bootJar \
            --no-daemon --stacktrace --max-workers=2

      - name: Build JVM control image
        run: |
          docker build \
            --tag hotel-pms/config-service-jvm:ci \
            --file config-service/Dockerfile .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Exactly one nativeCompile/native-image invocation occurs in this job.
      # The selected mode is quick (-Ob) for PR feedback or optimized (-O2)
      # for the manually dispatched final gate.
      - name: Build one Native image
        id: native_image
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: config-service/Dockerfile.native
          load: true
          push: false
          tags: hotel-pms/config-service-native:ci
          build-args: |
            NATIVE_BUILD_MODE=${{ env.NATIVE_BUILD_MODE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Classify Native build result
        if: always()
        run: |
          mkdir -p build
          if [[ "${{ steps.native_image.outcome }}" != success ]]; then
            echo "NATIVE_GATE_FAIL: native-image build failed" | tee build/config-native-gate-failure.txt
            exit 1
          fi

      - name: Run Native runtime gate
        id: native_runtime
        continue-on-error: true
        env:
          CI_NATIVE_BUILD_MODE: ${{ env.NATIVE_BUILD_MODE }}
        run: bash scripts/ci/verify-config-native-runtime.sh

      - name: Classify Native runtime result
        if: always()
        run: |
          mkdir -p build
          if [[ "${{ steps.native_runtime.outcome }}" != success ]]; then
            echo "NATIVE_GATE_FAIL: runtime contract or JVM comparison gate failed" | tee build/config-native-gate-failure.txt
            exit 1
          fi

      - name: Publish summary and metrics
        if: always()
        run: |
          {
            echo "## Config Service Native Gate"
            echo ""
            echo "- Native build mode: \`${NATIVE_BUILD_MODE}\`"
            echo "- Native build step: \`${{ steps.native_image.outcome }}\`"
            echo "- Native runtime gate: \`${{ steps.native_runtime.outcome }}\`"
            if [[ -f build/config-native-runtime/metrics.txt ]]; then
              cat build/config-native-runtime/metrics.txt
            fi
            if [[ -f build/config-native-gate-failure.txt ]]; then
              echo ""
              cat build/config-native-gate-failure.txt
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config-native-runtime-evidence
          path: |
            build/config-native-runtime
            build/config-native-gate-failure.txt
          if-no-files-found: warn

      - name: Clean up integration containers
        if: always()
        run: |
          docker rm --force config-service-native config-service-jvm 2>/dev/null || true
          docker network rm config-native-ci 2>/dev/null || true
