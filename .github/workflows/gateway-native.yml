name: API Gateway Native Image

on:
  workflow_dispatch:
    inputs:
      native_quick_build:
        description: "Use GraalVM quick build (-Ob); disable for the final optimized gate (-O2)"
        required: false
        default: false
        type: boolean
  pull_request:
    branches:
      - main
    paths:
      - "api-gateway/**"
      - "config-service/**"
      - "auth-service/**"
      - "frontdesk-service/**"
      - "internal-auth-lib/**"
      - "common-web-lib/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      # Gate/workflow-only changes use an explicit final O2 dispatch. They do
      # not duplicate a proven binary build with an automatic PR quick build.

concurrency:
  group: gateway-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-build-and-runtime:
    name: Build and validate api-gateway Native Image
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write
    env:
      CI_POSTGRES_PASSWORD: native-ci-postgres-password
      CI_REDIS_PASSWORD: native-ci-redis-password
      CI_CONFIG_PASSWORD: native-ci-config-password
      CI_HMAC_SECRET: native-ci-hmac-secret-with-sufficient-length
      CI_JWT_SECRET: bXktMzItYnl0ZS1zZWNyZXQta2V5LWZvci1jaS1yZXBsYWNlbWVudC0xMjM0NQ==
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Maven and Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: ${{ runner.os }}-gateway-jvm21-dependencies-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-gateway-jvm21-dependencies-

      - name: Build JVM gateway and real integration services
        run: |
          chmod +x ./gradlew
          ./gradlew \
            :config-service:bootJar \
            :auth-service:bootJar \
            :frontdesk-service:bootJar \
            :api-gateway:bootJar \
            -x :api-gateway:processAot \
            -x :api-gateway:processAotTest \
            --no-daemon --stacktrace --max-workers=2
          docker build --tag hotel-pms/config-service:ci --file config-service/Dockerfile .
          docker build --tag hotel-pms/auth-service:ci --file auth-service/Dockerfile .
          docker build --tag hotel-pms/frontdesk-service:ci --file frontdesk-service/Dockerfile .
          docker build --tag hotel-pms/api-gateway-jvm:ci --file api-gateway/Dockerfile .

      - name: Run cheap JVM tests and AOT preflight
        run: |
          ./gradlew :api-gateway:test --no-daemon --stacktrace --max-workers=2
          docker network create gateway-native-aot
          trap 'docker rm --force gateway-native-aot-config 2>/dev/null || true; docker network rm gateway-native-aot 2>/dev/null || true' EXIT
          docker run --detach --name gateway-native-aot-config --network gateway-native-aot \
            --publish 8888:8888 --publish 8090:8090 \
            --env CONFIG_SERVER_PASSWORD="${CI_CONFIG_PASSWORD}" \
            --env JWT_SECRET="${CI_JWT_SECRET}" \
            --env INTERNAL_HMAC_SECRET="${CI_HMAC_SECRET}" \
            hotel-pms/config-service:ci >/dev/null
          for _ in {1..90}; do
            curl --silent --fail http://127.0.0.1:8090/actuator/health >/dev/null && break
            sleep 2
          done
          curl --silent --fail http://127.0.0.1:8090/actuator/health >/dev/null
          CONFIG_SERVER_URL=http://127.0.0.1:8888 \
          CONFIG_SERVER_USERNAME=configuser \
          CONFIG_SERVER_PASSWORD="${CI_CONFIG_PASSWORD}" \
          SPRING_CLOUD_CONFIG_USERNAME=configuser \
          SPRING_CLOUD_CONFIG_PASSWORD="${CI_CONFIG_PASSWORD}" \
          INTERNAL_HMAC_SECRET="${CI_HMAC_SECRET}" \
          JWT_SECRET="${CI_JWT_SECRET}" \
          SPRING_PROFILES_ACTIVE=api-gateway \
          ./gradlew :api-gateway:processAot --no-daemon --stacktrace --max-workers=2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build one Native Image
        id: native_image
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api-gateway/Dockerfile.native
          load: true
          push: false
          tags: hotel-pms/api-gateway-native:ci
          build-args: |
            NATIVE_QUICK_BUILD=${{ github.event_name == 'pull_request' || inputs.native_quick_build }}
            CONFIG_SERVER_URL=http://127.0.0.1:8888
            CONFIG_SERVER_USERNAME=configuser
            CONFIG_SERVER_PASSWORD=${{ env.CI_CONFIG_PASSWORD }}
            INTERNAL_HMAC_SECRET=${{ env.CI_HMAC_SECRET }}
            INTERNAL_REDIS_PASSWORD=${{ env.CI_REDIS_PASSWORD }}
            JWT_SECRET=${{ env.CI_JWT_SECRET }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Classify Native build result
        if: steps.native_image.outcome == 'failure'
        run: |
          echo "NATIVE_GATE_FAIL: docker/build-push-action failed while building the single api-gateway Native Image" | tee -a "${GITHUB_STEP_SUMMARY}"
          exit 1

      - name: Verify image metadata
        run: |
          docker image inspect hotel-pms/api-gateway-native:ci
          docker image inspect hotel-pms/api-gateway-native:ci --format 'image_size_bytes={{.Size}}'

      - name: Run Native and JVM runtime gate
        id: runtime_gate
        env:
          CI_NATIVE_BUILD_MODE: ${{ (github.event_name == 'pull_request' || inputs.native_quick_build) && 'quick-Ob' || 'optimized-O2' }}
        run: bash scripts/ci/verify-gateway-native-runtime.sh

      - name: Archive validated O2 and JVM images
        if: github.event_name == 'workflow_dispatch' && !inputs.native_quick_build
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          output=build/gateway-native-images
          mkdir -p "${output}"
          for mode in native jvm; do
            image="hotel-pms/api-gateway-${mode}"
            docker tag "${image}:ci" "${image}:${SOURCE_SHA}"
            docker tag "${image}:ci" "${image}:validated"
            docker image inspect "${image}:${SOURCE_SHA}" > "${output}/${mode}-image-inspect.json"
          done
          archive="api-gateway-o2-jvm-${SOURCE_SHA}.tar.gz"
          docker save \
            "hotel-pms/api-gateway-native:${SOURCE_SHA}" hotel-pms/api-gateway-native:validated \
            "hotel-pms/api-gateway-jvm:${SOURCE_SHA}" hotel-pms/api-gateway-jvm:validated \
            | gzip -1 > "${output}/${archive}"
          gzip -t "${output}/${archive}"
          (cd "${output}" && sha256sum "${archive}" > SHA256SUMS && sha256sum --check SHA256SUMS)
          tar -xOzf "${output}/${archive}" manifest.json > "${output}/docker-save-manifest.json"
          jq -e --arg sha "${SOURCE_SHA}" \
            '([.[].RepoTags[]] | sort) == (["hotel-pms/api-gateway-native:" + $sha,
            "hotel-pms/api-gateway-native:validated", "hotel-pms/api-gateway-jvm:" + $sha,
            "hotel-pms/api-gateway-jvm:validated"] | sort)' "${output}/docker-save-manifest.json"
          jq -n --arg sha "${SOURCE_SHA}" --arg run "${RUN_URL}" --arg archive "${archive}" \
            --slurpfile native "${output}/native-image-inspect.json" \
            --slurpfile jvm "${output}/jvm-image-inspect.json" \
            '{source_sha: $sha, run_url: $run, native_build_mode: "optimized-O2", archive: $archive,
              native: $native[0][0], jvm: $jvm[0][0]}' > "${output}/provenance.json"

      - name: Upload validated O2 and JVM images
        id: images
        if: github.event_name == 'workflow_dispatch' && !inputs.native_quick_build
        uses: actions/upload-artifact@v4
        with:
          name: gateway-native-jvm-images-${{ github.sha }}
          path: build/gateway-native-images
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - name: Record downloadable image artifact
        if: steps.images.outcome == 'success'
        env:
          IMAGE_ARTIFACT_ID: ${{ steps.images.outputs.artifact-id }}
          IMAGE_ARTIFACT_URL: ${{ steps.images.outputs.artifact-url }}
          IMAGE_ARTIFACT_DIGEST: ${{ steps.images.outputs.artifact-digest }}
        run: |
          printf 'image_artifact_id=%s\nimage_artifact_url=%s\nimage_artifact_digest=%s\n' \
            "${IMAGE_ARTIFACT_ID}" "${IMAGE_ARTIFACT_URL}" "${IMAGE_ARTIFACT_DIGEST}" \
            >> build/gateway-native-runtime/metrics.txt
          cp build/gateway-native-images/{SHA256SUMS,provenance.json,docker-save-manifest.json} build/gateway-native-runtime/

      - name: Publish runtime metrics
        if: always()
        run: |
          if [[ -f build/gateway-native-runtime/metrics.txt ]]; then
            cat build/gateway-native-runtime/metrics.txt >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-native-runtime-evidence
          path: build/gateway-native-runtime
          if-no-files-found: warn

      - name: Classify runtime or export failure
        if: failure()
        run: |
          echo "NATIVE_GATE_FAIL: inspect gateway runtime evidence and image export steps" >> "${GITHUB_STEP_SUMMARY}"

      - name: Clean up integration containers
        if: always()
        run: |
          docker rm --force \
            api-gateway-native api-gateway-jvm gateway-native-auth \
            gateway-native-frontdesk gateway-native-redis gateway-native-postgres \
            gateway-native-config 2>/dev/null || true
          docker network rm gateway-native-ci 2>/dev/null || true
