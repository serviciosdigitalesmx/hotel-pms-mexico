name: Publish Fixi Monolith JVM container

on:
  push:
    branches:
      - codex/fixi-monolith
    paths:
      - '.github/workflows/fixi-monolith-container.yml'
      - '.github/workflows/fixi-monolith-smoke.yml'
      - 'fixi-monolith/**'
      - 'auth-service/**'
      - 'frontdesk-service/**'
      - 'guest-service/**'
      - 'billing-service/**'
      - 'fb-service/**'
      - 'notification-service/**'
      - 'internal-auth-lib/**'
      - 'common-web-lib/**'
      - 'pdf-template-engine/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write
  security-events: write

concurrency:
  group: fixi-monolith-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish immutable monolith image after smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Require successful monolith smoke for this exact SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_BRANCH" == "codex/fixi-monolith" ]]
          branch="$(jq -rn --arg value "$SOURCE_BRANCH" '$value|@uri')"
          for attempt in $(seq 1 90); do
            response="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/fixi-monolith-smoke.yml/runs?head_sha=${SOURCE_SHA}&branch=${branch}&per_page=100")"
            state="$(jq -r --arg sha "$SOURCE_SHA" --arg branch "$SOURCE_BRANCH" \
              '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == $branch and .event == "push")] | sort_by(.run_number) | last // empty | [.status, (.conclusion // "")] | @tsv' <<< "$response")"
            if [[ "$state" == $'completed\tsuccess' ]]; then
              echo "Monolith smoke succeeded for ${SOURCE_SHA}."
              break
            fi
            if [[ "$state" == $'completed\tfailure' || "$state" == $'completed\tcancelled' || "$state" == $'completed\ttimed_out' ]]; then
              echo "Monolith smoke ended with ${state} for ${SOURCE_SHA}." >&2
              exit 1
            fi
            if [[ "$attempt" -eq 90 ]]; then
              echo "No successful monolith smoke found for ${SOURCE_SHA}; last state: ${state:-not started}." >&2
              exit 1
            fi
            sleep 30
          done

      - name: Check out the exact source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: fixi-monolith-image-gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: fixi-monolith-image-gradle-${{ runner.os }}-

      - name: Package monolith JAR on GitHub Actions
        run: ./gradlew --no-daemon -x processAot -x processAotTest :fixi-monolith:bootJar

      - name: Stage the executable Spring Boot JAR for the image context
        shell: bash
        run: |
          set -euo pipefail
          jar="$(find fixi-monolith/build/libs -maxdepth 1 -name 'fixi-monolith-*.jar' ! -name '*-plain.jar' -print -quit)"
          test -n "$jar"
          cp "$jar" fixi-monolith/build/libs/fixi-monolith.jar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR with the job token
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish SHA-tagged monolith image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: fixi-monolith/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/fixi-monolith:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Fixi Monolith
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=fixi-monolith
          cache-to: type=gha,mode=max,scope=fixi-monolith
          provenance: true

      - name: Pull the exact published monolith digest for scanning
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/fixi-monolith@${{ steps.image.outputs.digest }}
        run: docker pull "$IMAGE"

      - name: Trivy vulnerability scan — published Fixi Monolith digest
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/fixi-monolith@${{ steps.image.outputs.digest }}
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          timeout: 10m0s

      - name: Trivy SARIF scan — published Fixi Monolith digest
        if: always()
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/fixi-monolith@${{ steps.image.outputs.digest }}
          format: sarif
          output: trivy-fixi-monolith.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          timeout: 10m0s

      - name: Upload Fixi Monolith SARIF to GitHub Security
        if: always() && hashFiles('trivy-fixi-monolith.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        with:
          sarif_file: trivy-fixi-monolith.sarif
          category: trivy-fixi-monolith

      - name: Trivy misconfiguration scan — production Compose
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: fixi-monolith/deploy/compose.yml
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH

      - name: Record immutable image reference
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/fixi-monolith:${{ github.sha }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            echo '## Fixi Monolith image'
            echo
            echo "- Source SHA: \`${GITHUB_SHA}\`"
            echo "- Image: \`${IMAGE}\`"
            echo "- Digest: \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Exercise the published image with the production Compose stack
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/fixi-monolith:${{ github.sha }}@${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          env_file="$(mktemp)"
          project="fixi-ci-${GITHUB_RUN_ID}"
          compose=(docker compose --project-name "$project" --file fixi-monolith/deploy/compose.yml --env-file "$env_file")
          cleanup() {
            "${compose[@]}" down --volumes --remove-orphans >/dev/null 2>&1 || true
            rm -f "$env_file"
          }
          trap cleanup EXIT

          cat > "$env_file" <<EOF
          FIXI_IMAGE=${IMAGE}
          FIXI_PUBLIC_HOST=localhost
          GW_CORS_ALLOWED_ORIGINS=https://localhost
          POSTGRES_ADMIN_PASSWORD=$(openssl rand -hex 32)
          DATABASE_PASSWORD=$(openssl rand -hex 32)
          REDIS_PASSWORD=$(openssl rand -hex 32)
          JWT_SECRET=$(openssl rand -hex 48)
          SECURITY_SECRETS_ENCRYPTION_KEY=$(openssl rand -hex 32)
          SECURITY_SECRETS_ENCRYPTION_SALT=$(openssl rand -hex 32)
          EOF

          "${compose[@]}" up --detach --pull always --wait --wait-timeout 900

          for service in postgres redis fixi-monolith caddy; do
            container="$("${compose[@]}" ps --quiet "$service")"
            test -n "$container"
            docker inspect --format '{{.State.Status}} {{.State.Health.Status}}' "$container" | grep -Fx 'running healthy'
          done

          app_health="$("${compose[@]}" exec --no-TTY fixi-monolith curl --fail --silent http://127.0.0.1:8090/actuator/health/readiness)"
          jq -e '.status == "UP"' <<< "$app_health"
          "${compose[@]}" exec --no-TTY postgres pg_isready -U fixi_app -d fixi
          app_is_superuser="$("${compose[@]}" exec --no-TTY postgres psql --username postgres --dbname fixi --no-align --tuples-only --command "SELECT rolsuper FROM pg_roles WHERE rolname = 'fixi_app'")"
          [[ "$app_is_superuser" == "f" ]]
          installed_extensions="$("${compose[@]}" exec --no-TTY postgres psql --username postgres --dbname fixi --no-align --tuples-only --command "SELECT count(*) FROM pg_extension WHERE extname IN ('pg_trgm', 'btree_gist')")"
          [[ "$installed_extensions" == "2" ]]
          redis_health="$("${compose[@]}" exec --no-TTY redis sh -ec 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping')"
          [[ "$redis_health" == "PONG" ]]

          for service in postgres redis fixi-monolith; do
            container="$("${compose[@]}" ps --quiet "$service")"
            bindings="$(docker inspect --format '{{json .HostConfig.PortBindings}}' "$container")"
            jq -e '(. == null) or all(.[]; . == null or . == [])' <<< "$bindings"
          done
          caddy_container="$("${compose[@]}" ps --quiet caddy)"
          caddy_bindings="$(docker inspect --format '{{json .HostConfig.PortBindings}}' "$caddy_container")"
          jq -e 'keys == ["443/tcp", "80/tcp"] and all(.[]; length >= 1)' <<< "$caddy_bindings"

          http_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --resolve 'localhost:80:127.0.0.1' http://localhost/)"
          echo "Caddy HTTP redirect status: ${http_status}"
          [[ "$http_status" == "308" || "$http_status" == "301" ]]
          https_status="$(curl --insecure --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --resolve 'localhost:443:127.0.0.1' https://localhost/)"
          echo "Caddy HTTPS backend status: ${https_status}"
          [[ "$https_status" == "401" || "$https_status" == "403" || "$https_status" == "404" ]]

          echo 'Published image, private Postgres/Redis, production seed cleanup, and Caddy-only ports passed.'
