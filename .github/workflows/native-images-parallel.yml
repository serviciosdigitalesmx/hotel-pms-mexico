name: Publish Fixi Native Images (Parallel)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'api-gateway/**'
      - 'auth-service/**'
      - 'billing-service/**'
      - 'config-service/**'
      - 'fb-service/**'
      - 'frontdesk-service/**'
      - 'guest-service/**'
      - 'notification-service/**'
      - 'common-web-lib/**'
      - 'internal-auth-lib/**'
      - 'pdf-template-engine/**'
      - 'gradle/**'
      - 'gradlew'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'docker-compose.native.yml'
      - '.github/workflows/native-images-parallel.yml'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: fixi

jobs:
  publish:
    name: Build ${{ matrix.service }} Native image
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - service: config-server
            dockerfile: config-service/Dockerfile.native
            scope: config-server
          - service: auth-service
            dockerfile: auth-service/Dockerfile.native
            scope: auth-service
          - service: api-gateway
            dockerfile: api-gateway/Dockerfile.native
            scope: api-gateway
          - service: guest-service
            dockerfile: guest-service/Dockerfile.native
            scope: guest-service
          - service: frontdesk-service
            dockerfile: frontdesk-service/Dockerfile.native
            scope: frontdesk-service
          - service: billing-service
            dockerfile: billing-service/Dockerfile.native
            scope: billing-service
          - service: fb-service
            dockerfile: fb-service/Dockerfile.native
            scope: fb-service
          - service: notification-service
            dockerfile: notification-service/Dockerfile.native
            scope: notification-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Prepare config-server artifact for dependent builds
        env:
          SPRING_PROFILES_ACTIVE: native
          CONFIG_SERVER_USERNAME: configuser
          CONFIG_SERVER_PASSWORD: ci-config-password
        run: |
          chmod +x ./gradlew
          ./gradlew :config-service:bootJar --no-daemon --stacktrace --max-workers=2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=native-${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=native-${{ matrix.scope }}

  aliases:
    name: Publish native-latest aliases
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Alias all SHA images as native-latest
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for service in config-server auth-service api-gateway guest-service frontdesk-service billing-service fb-service notification-service; do
            docker buildx imagetools create \
              --tag "ghcr.io/${OWNER}/fixi-${service}:native-latest" \
              "ghcr.io/${OWNER}/fixi-${service}:${SHA}"
          done
